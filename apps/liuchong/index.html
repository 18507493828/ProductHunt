<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>遛宠圈 · 同城搭子</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
  :root {
    --sky: #7ec8e8; --cream: #fff8ee; --peach: #ffc9a8; --ink: #3d342c;
    --muted: #9a8b7c; --grass: #8fbf7a; --coral: #ff8f6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Noto Sans SC", system-ui, sans-serif;
    background: #e8dcc8; min-height: 100vh; display: flex; justify-content: center; color: var(--ink);
  }
  #phone {
    width: 100%; max-width: 430px; height: 100dvh; min-height: 100dvh; max-height: 100dvh;
    background: linear-gradient(180deg, #b8dff0 0%, #d4eef8 18%, var(--cream) 42%);
    display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .sky-deco {
    position: absolute; top: 24px; left: 20px; right: 20px; height: 40px; pointer-events: none; opacity: .5;
  }
  .cloud {
    position: absolute; background: #fff; border-radius: 999px; height: 18px;
    animation: drift 18s linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: #fff; border-radius: 50%;
  }
  .cloud.c1 { width: 54px; top: 0; left: 10%; }
  .cloud.c1::before { width: 22px; height: 22px; top: -10px; left: 8px; }
  .cloud.c1::after { width: 28px; height: 28px; top: -14px; left: 22px; }
  .cloud.c2 { width: 40px; top: 12px; left: 60%; animation-duration: 22s; animation-delay: -5s; }
  .cloud.c2::before { width: 18px; height: 18px; top: -8px; left: 6px; }
  .cloud.c2::after { width: 22px; height: 22px; top: -12px; left: 16px; }
  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(30px); }
  }

  header {
    padding: 28px 20px 8px; position: relative; z-index: 2;
  }
  header h1 {
    font-family: Quicksand, "Noto Sans SC", sans-serif; font-size: 26px; font-weight: 700;
    color: #4a7a8c; letter-spacing: -.02em;
  }
  header p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .geo-hint { font-size: 11px; color: #6a8a9a; margin-top: 4px; min-height: 14px; }
  .nav-walk {
    border: none; background: #e8f2f6; color: #4a7a8c;
    font: inherit; font-size: 12px; font-weight: 700;
    padding: 6px 10px; border-radius: 999px; cursor: pointer; flex: none;
  }

  .mine-strip {
    position: sticky; top: 0; z-index: 8;
    margin: 0 14px 0; padding: 12px;
    background: rgba(255,255,255,.94); backdrop-filter: blur(8px);
    border: 2px solid rgba(255,143,107,.25); border-radius: 16px;
    box-shadow: 0 6px 18px rgba(180,150,120,.12);
    scroll-margin-top: 8px; max-height: 28vh; overflow: auto;
    transition: box-shadow .25s, border-color .25s;
  }
  .mine-strip.focus {
    border-color: var(--coral);
    box-shadow: 0 0 0 3px rgba(255,143,107,.25), 0 6px 18px rgba(180,150,120,.12);
  }
  .mine-strip .head {
    font-family: Quicksand, sans-serif; font-size: 13px; font-weight: 700;
    color: #4a7a8c; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
  }
  .mine-strip .head em { font-style: normal; font-size: 11px; color: var(--muted); font-weight: 600; }
  .mine-strip.empty-hint {
    font-size: 12px; color: var(--muted); padding: 2px 0;
  }
  .mine-item {
    display: flex; flex-direction: column; gap: 6px; padding: 10px 0;
    border-top: 1px dashed rgba(154,139,124,.25);
  }
  .mine-item:first-of-type { border-top: none; padding-top: 0; }
  .mine-item.hi { animation: minePulse .9s ease; }
  @keyframes minePulse {
    0% { background: rgba(255,143,107,.12); border-radius: 12px; }
    100% { background: transparent; }
  }
  .mine-item .row { display: flex; align-items: flex-start; gap: 8px; }
  .mine-item .info { flex: 1; min-width: 0; }
  .mine-item b { display: block; font-size: 14px; font-weight: 700; }
  .mine-item .meta { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 2px; }
  .mine-item .pals { font-size: 12px; color: #6a5a4c; margin-top: 2px; }
  .mine-item .cancel {
    border: none; background: #fff5eb; color: var(--coral);
    font: inherit; font-size: 12px; font-weight: 700;
    padding: 6px 10px; border-radius: 999px; cursor: pointer; flex: none;
  }

  .map-strip {
    margin: 8px 14px 0; height: 200px; position: relative; overflow: hidden;
    border-radius: 20px; box-shadow: 0 8px 24px rgba(120,140,100,.15);
    border: 2px solid rgba(255,255,255,.7); z-index: 1; background: #d4e8c8;
    flex: none;
  }
  .map-strip .map-fallback {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 16px; font-size: 12px; color: #6a8a5a; line-height: 1.5; pointer-events: none;
  }
  .map-strip.has-map .map-fallback { display: none; }
  .map-strip .leaflet-container { height: 100%; width: 100%; font: inherit; background: #d4e8c8; }
  .map-strip .leaflet-control-attribution { font-size: 9px; }
  .walk-marker { background: none !important; border: none !important; }
  .walk-pin {
    width: 40px; height: 40px; border-radius: 50%;
    background: #fff; border: 3px solid #fff; box-shadow: 0 4px 12px rgba(80,60,40,.2);
    display: grid; place-items: center; font-size: 20px; line-height: 1;
  }
  .walk-pin.on { border-color: var(--coral); transform: scale(1.1); }
  .walk-pin.joined { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(255,143,107,.35), 0 4px 12px rgba(80,60,40,.2); }
  .me-pin {
    width: 16px; height: 16px; border-radius: 50%;
    background: #4a7a8c; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(74,122,140,.45);
  }

  .walk-list {
    flex: 1; padding: 14px 14px 130px; overflow: auto; min-height: 0;
  }
  .walk-list h2 {
    font-family: Quicksand, sans-serif; font-size: 15px; color: #6a8a9a; margin-bottom: 10px;
  }
  .walk {
    background: #fff; border-radius: 18px; padding: 14px; margin-bottom: 10px;
    box-shadow: 0 4px 16px rgba(180,150,120,.1); display: grid; grid-template-columns: 1fr auto; gap: 8px;
    align-items: center; border: 2px solid transparent; transition: border .2s;
  }
  .walk.highlight { border-color: var(--coral); }
  .walk h3 { font-size: 15px; font-weight: 700; }
  .walk .meta { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
  .pets-row { display: flex; margin-top: 8px; }
  .pets-row span {
    width: 28px; height: 28px; border-radius: 50%; background: #fff5eb; border: 2px solid #fff;
    display: grid; place-items: center; font-size: 14px; margin-left: -6px;
  }
  .pets-row span:first-child { margin-left: 0; }
  .join {
    border: none; background: linear-gradient(145deg, var(--peach), var(--coral));
    color: #fff; font: inherit; font-weight: 800; font-size: 13px; padding: 10px 14px;
    border-radius: 999px; cursor: pointer; box-shadow: 0 4px 12px rgba(255,143,107,.35);
  }
  .join.done { background: #e8efe4; color: var(--grass); box-shadow: none; }

  .compose {
    position: absolute; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom));
    background: #fff; border-radius: 20px; padding: 12px 14px;
    box-shadow: 0 10px 32px rgba(80,60,40,.15); display: flex; flex-direction: column; gap: 8px; z-index: 10;
  }
  .compose .row { display: flex; gap: 8px; align-items: center; }
  .compose input {
    flex: 1; border: none; background: #fff8ee; border-radius: 12px; padding: 11px 12px;
    font: inherit; font-size: 13px; outline: none; min-width: 0;
  }
  .compose button {
    border: none; background: #4a7a8c; color: #fff; font: inherit; font-weight: 700;
    font-size: 13px; padding: 11px 14px; border-radius: 12px; cursor: pointer; flex: none;
  }
  .toast {
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);
    background: #4a7a8c; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px;
    opacity: 0; transition: .25s; z-index: 40; pointer-events: none; font-weight: 600;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>
<div id="phone">
  <div class="sky-deco">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
  </div>
  <header>
    <h1>遛宠圈</h1>
    <p>今天一起出门吸氧吧</p>
    <div class="geo-hint" id="geoHint">定位中…</div>
    <button type="button" class="nav-walk" id="relocate-btn" style="margin-top:8px">重新定位</button>
  </header>
  <div class="mine-strip" id="mine-strip"></div>
  <div class="toast" id="toast"></div>

  <div class="map-strip" id="map">
    <div class="map-fallback" id="map-fallback">地图加载中…</div>
    <div id="map-canvas" style="height:100%;width:100%"></div>
  </div>

  <div class="walk-list">
    <h2>附近遛宠局</h2>
    <div id="list"></div>
  </div>

  <div class="compose">
    <input id="newRoute" placeholder="路线名：如 傍晚滨河线 · 带柯基" maxlength="40">
    <div class="row">
      <input id="newTime" placeholder="时间：今天 18:00" maxlength="24">
      <input id="newPlace" placeholder="集合点" maxlength="28">
      <button id="startWalk">出发</button>
    </div>
  </div>
</div>
<script>
function mscMe(){ return (window.MashangChuangAuth && MashangChuangAuth.meLabel()) || window.__MSC_ME__ || "我"; }
const LS = "liuchong-walks-v3";
const PET_EMOJI = ["🐕","🐈","🐩","🦮","🐶","🐱","🐰","🦊"];
const DEFAULT_WALKS = [
  { id:"w1", title:"滨河晚风线", time:"今天 18:00", place:"滨河公园西门", dNorth:1800, dEast:-1600, pets:["🐕","🐈"], petNames:["豆豆","咪咪"], host:"小鹿", joined:false },
  { id:"w2", title:"湖心一圈浅跑", time:"今天 17:30", place:"城南湖步道", dNorth:-2200, dEast:2200, pets:["🐩","🦮","🐶"], petNames:["棉花糖","阿黄","球球"], host:"阿汤", joined:false },
  { id:"w3", title:"社区花园晒太阳", time:"明天 09:00", place:"梧桐社区花园", dNorth:900, dEast:800, pets:["🐱","🐰"], petNames:["橘子","蹦蹦"], host:"绵绵", joined:false },
  { id:"w4", title:"夜遛小吃局", time:"今天 20:30", place:"大学路夜市口", dNorth:-1200, dEast:-1300, pets:["🐕","🦊"], petNames:["旺财","小狐"], host:"皮皮", joined:false },
];
let walks = DEFAULT_WALKS.map(w=>({...w, pets:w.pets.slice(), petNames:w.petNames.slice(), map: w.map ? {...w.map} : {x:50,y:50}}));
let focus = walks[0].id;
let highlightMine = null;
let userPos = null;
let geoOk = false;
let userPlaceLabel = "";
let leafletMap = null;
let meMarker = null;
const walkMarkers = new Map();

function applyGeoToWalks(pos){
  if(!pos || !window.MashangChuangGeo) return;
  const G = MashangChuangGeo;
  walks.forEach(w => {
    if(w.lat == null || w.lng == null){
      const p = G.offsetLatLng(pos.lat, pos.lng, w.dNorth || 400, w.dEast || 200);
      w.lat = p.lat; w.lng = p.lng;
    }
    const meters = G.haversine(pos, { lat: w.lat, lng: w.lng });
    w.dist = G.formatDist(meters);
  });
}

function leaveOrDeleteWalk(w){
  if(!w) return;
  const isHost = w.mine || w.host === mscMe() || w.host === "我" || (!!window.__MSC_ME__ && w.host === window.__MSC_ME__);
  if(isHost){
    walks = walks.filter(x=>x.id!==w.id);
    if(focus===w.id) focus = (walks[0] && walks[0].id) || null;
    toast("已删除我发起的路线");
  } else {
    w.joined = false;
    toast("已取消本次遛宠");
  }
  save(); render();
}

function walkIcon(w){
  const L = window.L;
  const emoji = (w.pets && w.pets[0]) || "🐾";
  const on = focus === w.id ? " on" : "";
  const joined = w.joined ? " joined" : "";
  return L.divIcon({
    className: "walk-marker",
    html: `<div class="walk-pin${on}${joined}">${emoji}</div>`,
    iconSize: [40, 40],
    iconAnchor: [20, 20]
  });
}
function meIcon(){
  return window.L.divIcon({
    className: "walk-marker",
    html: '<div class="me-pin"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });
}

async function ensureMap(){
  const strip = $("map");
  const fallback = $("map-fallback");
  if(!window.MashangChuangGeo){
    if(fallback) fallback.textContent = "地图组件未加载";
    return null;
  }
  try{
    const center = userPos || MashangChuangGeo.FALLBACK;
    const res = await MashangChuangGeo.createMap("map-canvas", center);
    leafletMap = res.map;
    if(strip) strip.classList.add("has-map");
    setTimeout(()=>{ try{ leafletMap && leafletMap.invalidateSize(); }catch(e){} }, 120);
    setTimeout(()=>{ try{ leafletMap && leafletMap.invalidateSize(); }catch(e){} }, 400);
    return leafletMap;
  }catch(e){
    if(fallback) fallback.textContent = "地图暂时不可用 · 仍可浏览下方遛宠局";
    return null;
  }
}

function syncMapMarkers(){
  if(!leafletMap || !window.L) return;
  walkMarkers.forEach(m => leafletMap.removeLayer(m));
  walkMarkers.clear();
  walks.forEach(w => {
    if(w.lat == null || w.lng == null) return;
    const m = L.marker([w.lat, w.lng], { icon: walkIcon(w), title: w.title, zIndexOffset: focus === w.id ? 500 : 0 })
      .addTo(leafletMap)
      .bindTooltip(w.title, { direction: "top", offset: [0, -18] });
    m.on("click", () => {
      focus = w.id;
      render();
      document.querySelector(`.walk[data-id="${focus}"]`)?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
    walkMarkers.set(w.id, m);
  });
  if(userPos){
    if(meMarker) leafletMap.removeLayer(meMarker);
    meMarker = L.marker([userPos.lat, userPos.lng], { icon: meIcon(), zIndexOffset: 1000, title: "我的位置" }).addTo(leafletMap);
  }
}

function fitMapBounds(){
  if(!leafletMap) return;
  const latlngs = walks.filter(w => w.lat != null && w.lng != null).map(w => [w.lat, w.lng]);
  if(userPos) latlngs.push([userPos.lat, userPos.lng]);
  if(!latlngs.length) return;
  leafletMap.fitBounds(latlngs, { padding: [28, 28], maxZoom: 15 });
}

async function locateWalks(showToast){
  if(!window.MashangChuangGeo) return;
  const hint = $("geoHint");
  if(hint) hint.textContent = "正在定位…";
  const btn = $("relocate-btn");
  if(btn) btn.disabled = true;
  const loc = await MashangChuangGeo.locateWithPlace();
  userPos = loc.pos;
  geoOk = !!loc.ok;
  userPlaceLabel = loc.ok
    ? (loc.placeLabel || loc.placeShort || "当前位置")
    : MashangChuangGeo.FALLBACK.label;
  applyGeoToWalks(userPos);
  if(hint) hint.textContent = geoOk
    ? ("已定位 · " + userPlaceLabel)
    : ("定位未授权 · " + userPlaceLabel);
  save();
  await ensureMap();
  render();
  fitMapBounds();
  if(btn) btn.disabled = false;
  if(showToast) toast(geoOk ? ("已重新定位 · " + userPlaceLabel) : "定位失败，使用默认位置");
}

const $=id=>document.getElementById(id);
const save=()=>MashangChuangAuth.writeJSON(LS, walks);
const toast=m=>{ const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); };
$("relocate-btn")?.addEventListener("click", ()=>locateWalks(true));

function focusMine(id){
  highlightMine = id;
  const el = $("mine-strip");
  el.classList.add("focus");
  renderMine();
  el.scrollIntoView({ behavior:"smooth", block:"start" });
  clearTimeout(window.__mineHi);
  window.__mineHi = setTimeout(()=>{
    highlightMine = null;
    el.classList.remove("focus");
    renderMine();
  }, 2000);
}

function renderMine(){
  const mine = walks.filter(w=>w.joined);
  const el = $("mine-strip");
  if(!mine.length){
    el.innerHTML = `<div class="head">我的遛宠局</div><div class="empty-hint">还没加入，点一起遛</div>`;
    return;
  }
  el.innerHTML = `<div class="head">我的遛宠局 · ${mine.length}<em>路线 · 时间 · 毛孩搭子</em></div>` + mine.map(w=>{
    const pals = (w.petNames||[]).join("、") || "待定";
    return `
    <div class="mine-item ${highlightMine===w.id?"hi":""}" data-focus="${w.id}">
      <div class="row">
        <div class="info">
          <b>${w.title}</b>
          <div class="meta">${w.time} · ${w.place} · 约 ${w.dist||"—"}</div>
          <div class="pals">毛孩搭子：${pals} ${w.pets.map(p=>p).join("")}</div>
        </div>
        ${w.lat!=null?`<button type="button" class="nav-walk" data-nav="${w.id}">导航</button>`:""}
        <button type="button" class="cancel" data-cancel="${w.id}">${(w.mine||w.host===mscMe())?"删除路线":"取消"}</button>
      </div>
    </div>`;
  }).join("");
}

function renderList(){
  $("list").innerHTML = walks.map(w=>`
    <article class="walk ${focus===w.id?'highlight':''}" data-id="${w.id}">
      <div>
        <h3>${w.title}</h3>
        <div class="meta">${w.time} · ${w.place} · ${w.dist||"—"}<br>发起人 ${w.host} · ${(w.petNames||[]).join("、")||w.pets.length+" 只毛孩子"}</div>
        <div class="pets-row">${w.pets.map(p=>`<span>${p}</span>`).join("")}${w.joined?`<span>🙋</span>`:""}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:stretch">
        ${w.lat!=null?`<button type="button" class="nav-walk" data-nav="${w.id}">导航</button>`:""}
        <button class="join ${w.joined?'done':''}" data-join="${w.id}">${w.joined?(w.mine||w.host===mscMe()?"删除路线":"已加入"):"一起遛"}</button>
      </div>
    </article>`).join("");

  $("list").onclick = e => {
    const nav = e.target.closest("[data-nav]");
    if(nav){
      const w = walks.find(x=>x.id===nav.dataset.nav);
      if(w && w.lat != null && window.MashangChuangGeo) MashangChuangGeo.openNav({ lat:w.lat, lng:w.lng, name:w.place||w.title });
      return;
    }
    const join = e.target.closest("[data-join]");
    const card = e.target.closest("[data-id]");
    if(join){
      const w = walks.find(x=>x.id===join.dataset.join);
      if(!w) return;
      if(w.joined){
        leaveOrDeleteWalk(w);
      } else {
        w.joined = true;
        focus = w.id;
        save(); render();
        toast(`已加入「${w.title}」`);
        focusMine(w.id);
      }
      return;
    }
    if(card){ focus = card.dataset.id; render(); }
  };
}

function render(){ renderMine(); syncMapMarkers(); renderList(); }

$("mine-strip").onclick = e => {
  const nav = e.target.closest("[data-nav]");
  if(nav){
    const w = walks.find(x=>x.id===nav.dataset.nav);
    if(w && w.lat != null && window.MashangChuangGeo) MashangChuangGeo.openNav({ lat:w.lat, lng:w.lng, name:w.place||w.title });
    return;
  }
  const cancel = e.target.closest("[data-cancel]");
  if(cancel){
    const w = walks.find(x=>x.id===cancel.dataset.cancel);
    leaveOrDeleteWalk(w);
    return;
  }
  const row = e.target.closest("[data-focus]");
  if(row){
    focus = row.dataset.focus;
    render();
    document.querySelector(`.walk[data-id="${focus}"]`)?.scrollIntoView({ behavior:"smooth", block:"nearest" });
  }
};

$("startWalk").onclick = () => {
  const title = $("newRoute").value.trim();
  if(!title){ $("newRoute").focus(); toast("写一条路线名字吧"); return; }
  const pet = PET_EMOJI[Math.floor(Math.random()*PET_EMOJI.length)];
  const origin = userPos || (window.MashangChuangGeo && MashangChuangGeo.FALLBACK) || { lat:30.2741, lng:120.1551 };
  const ang = Math.random() * Math.PI * 2;
  const meters = 400 + Math.floor(Math.random() * 401);
  const dNorth = Math.cos(ang) * meters;
  const dEast = Math.sin(ang) * meters;
  let lat, lng, dist = "约 " + (meters >= 1000 ? (meters/1000).toFixed(1)+"km" : meters+"m");
  if(window.MashangChuangGeo){
    const p = MashangChuangGeo.offsetLatLng(origin.lat, origin.lng, dNorth, dEast);
    lat = p.lat; lng = p.lng;
    dist = MashangChuangGeo.formatDist(MashangChuangGeo.haversine(origin, p));
  }
  const nw = {
    id: "w"+Date.now(), title,
    time: $("newTime").value.trim() || "待定",
    place: $("newPlace").value.trim() || "自定集合点",
    dist, lat, lng, dNorth, dEast,
    pets: [pet], petNames: ["我家宝贝"], host: mscMe(), joined: true, mine: true,
    map: { x: 50, y: 50 }
  };
  walks.unshift(nw); focus = nw.id; save();
  $("newRoute").value = "";
  $("newTime").value = "";
  $("newPlace").value = "";
  toast("路线已放到地图上");
  render();
  fitMapBounds();
  focusMine(nw.id);
};

</script>
<script src="/apps/_shared/geo.js"></script>
<script src="/apps/_shared/auth.js"></script>

<script>
(function(){
  if(!window.MashangChuangAuth) return;
  MashangChuangAuth.boot({
    requireLogin: false,
    appName: '遛宠圈',
    onReady: async function(user){
      window.__MSC_USER__ = user;
      document.dispatchEvent(new CustomEvent('msc-auth-ready', { detail: user }));
      try {
        var label = MashangChuangAuth.meLabel('我');
        window.__MSC_ME__ = label;
      } catch(e) {}
      walks = MashangChuangAuth.readJSON(LS, null) || DEFAULT_WALKS.map(function(w){
        return Object.assign({}, w, { pets: w.pets.slice(), petNames: w.petNames.slice(), map: Object.assign({}, w.map || {x:50,y:50}) });
      });
      if(!walks.find(function(w){ return w.id === focus; })) focus = walks[0] && walks[0].id;
      if(window.MashangChuangGeo){
        userPos = MashangChuangGeo.FALLBACK;
        userPlaceLabel = MashangChuangGeo.FALLBACK.label || "杭州西湖附近";
        applyGeoToWalks(userPos);
      }
      if(typeof render === 'function') render();
      if(typeof ensureMap === 'function'){
        ensureMap().then(function(){ if(typeof fitMapBounds === 'function') fitMapBounds(); });
      }
      if(typeof locateWalks === 'function') locateWalks();
    }
  });
})();
</script>
