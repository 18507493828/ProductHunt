<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旧物捐赠地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
:root{
  --green:#2e7d32;--leaf:#43a047;--mint:#e8f5e9;--ink:#1b2e1c;--muted:#5a6b5c;
  --paper:#f7fbf7;--panel:#fff;--line:rgba(46,125,50,.12);--amber:#ef6c00;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Noto Sans SC",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 10% -10%,#c8e6c9 0%,transparent 55%),
             radial-gradient(900px 500px at 100% 0%,#a5d6a7 0%,transparent 50%),
             #edf5ee;
}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;max-width:1280px;margin:0 auto;padding:16px 20px 20px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.mark{
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(145deg,var(--leaf),var(--green));
  display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;
  box-shadow:0 8px 20px rgba(46,125,50,.28);
}
.brand h1{font-size:20px;font-weight:900;letter-spacing:.02em}
.brand p{font-size:12px;color:var(--muted);margin-top:2px}
.eco-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--mint);padding:8px 14px;border-radius:999px}
.workspace{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;min-height:0}
@media(max-width:960px){.workspace{grid-template-columns:1fr}}
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:20px;
  box-shadow:0 12px 40px rgba(27,46,28,.06);overflow:hidden;min-height:0;
  display:flex;flex-direction:column;
}
.map-panel{position:relative}
.map-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.map-head > div:first-child{flex:1;min-width:min(100%,220px)}
.map-head h2{font-size:15px;font-weight:800}
.map-head .meta{font-size:12px;color:var(--muted);text-align:left;line-height:1.45;margin-top:4px;word-break:keep-all;overflow-wrap:anywhere}
.map-tools{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.map-tools .loc-btn{
  border:1px solid rgba(46,125,50,.25);background:#fff;color:var(--green);
  font:inherit;font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;cursor:pointer;
}
.map-tools .loc-btn:hover{background:var(--mint)}
.map-tools .loc-btn:disabled{opacity:.55;cursor:wait}
.map-wrap{flex:1;position:relative;min-height:520px;z-index:0}
.map-canvas{height:100%;min-height:520px;background:#e8f5e9}
.map-canvas.leaflet-container{font:inherit}
.legend{
  position:absolute;left:14px;bottom:14px;z-index:800;
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;font-size:12px;display:flex;gap:12px;pointer-events:none;
}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.legend .a{background:var(--leaf)}.legend .b{background:#1e88e5}.legend .c{background:#ef6c00}
.pin-icon{background:transparent;border:none}
.pin-mark{
  width:28px;height:28px;position:relative;margin-left:-14px;margin-top:-28px;
}
.pin-mark::before{
  content:"";display:block;width:22px;height:22px;margin:0 auto;
  border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  background:linear-gradient(135deg,var(--leaf),var(--green));
  box-shadow:0 6px 14px rgba(46,125,50,.35);
}
.pin-mark::after{content:"";display:block;width:8px;height:8px;margin:-15px auto 0;border-radius:50%;background:#fff}
.pin-mark.active::before{background:linear-gradient(135deg,#ffb74d,#ef6c00);transform:rotate(-45deg) scale(1.12)}
.me-dot{
  width:18px;height:18px;margin-left:-9px;margin-top:-9px;border-radius:50%;
  background:#1e88e5;border:3px solid #fff;box-shadow:0 0 0 6px rgba(30,136,229,.22);
}
.side{padding:0;overflow:auto}
.detail{padding:20px 22px 10px}
.detail .type{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green);background:var(--mint);padding:5px 10px;border-radius:999px;margin-bottom:10px}
.detail h3{font-size:22px;font-weight:900;margin-bottom:6px}
.detail .addr{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.fact{background:var(--mint);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-size:14px;font-weight:800}.fact span{font-size:11px;color:var(--muted)}
.form-box{border-top:1px dashed var(--line);padding:16px 22px 22px;background:linear-gradient(180deg,#fbfff0 0%,#fff 40%)}
.form-box h4{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.form-box h4::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--leaf)}
.field{margin-bottom:10px}
.field label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.field label button{
  border:none;background:transparent;color:var(--leaf);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:0;
}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:#fff;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--leaf);box-shadow:0 0 0 3px rgba(67,160,71,.15)}
.btn{
  width:100%;border:none;border-radius:14px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;
  background:linear-gradient(135deg,var(--leaf),var(--green));color:#fff;
  box-shadow:0 8px 20px rgba(46,125,50,.25);
}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:#fff;color:var(--green);border:1px solid rgba(46,125,50,.25);box-shadow:none;margin-top:8px}
.records{
  margin-top:16px;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:#fff;scroll-margin-top:12px;
}
.records.open{box-shadow:0 0 0 3px rgba(67,160,71,.18)}
.records-head{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:12px 14px;background:var(--mint);cursor:pointer;user-select:none;
}
.records-head h5{font-size:13px;font-weight:800;color:var(--green)}
.records-head .meta{font-size:11px;color:var(--muted)}
.records-body{display:none;padding:8px;max-height:280px;overflow:auto}
.records.expanded .records-body{display:block}
.log-row{
  display:grid;grid-template-columns:1fr auto;gap:6px 10px;text-align:left;width:100%;
  border:1px solid transparent;background:#fafdfb;border-radius:12px;padding:10px 12px;
  margin-bottom:6px;cursor:pointer;font:inherit;color:inherit;
}
.log-row:last-child{margin-bottom:0}
.log-row:hover{border-color:rgba(46,125,50,.2)}
.log-row.hi{border-color:rgba(67,160,71,.55);background:#eef9ef;animation:pulseHi .9s ease}
.log-row.on{border-color:var(--leaf);background:#e8f5e9}
@keyframes pulseHi{0%{box-shadow:0 0 0 0 rgba(67,160,71,.35)}100%{box-shadow:0 0 0 8px transparent}}
.log-row .kind{
  font-size:11px;font-weight:800;color:var(--green);background:var(--mint);
  padding:2px 8px;border-radius:999px;justify-self:start;
}
.log-row .kind.door{color:var(--amber);background:#fff3e0}
.log-row b{display:block;font-size:13px;font-weight:800;margin-top:4px}
.log-row .sub{font-size:11px;color:var(--muted);line-height:1.45;margin-top:2px}
.log-row .status{font-size:11px;font-weight:800;color:var(--leaf);align-self:center}
.log-row .status.canceled{color:#9a3412}
.log-detail .act-row{display:flex;gap:8px;margin-top:12px}
.log-detail .act-row .btn{flex:1;margin-top:0;padding:10px}
.log-empty{font-size:12px;color:var(--muted);padding:14px 10px;text-align:center}
.log-detail{
  display:none;margin-top:8px;padding:12px 14px;border-top:1px dashed var(--line);
  background:linear-gradient(180deg,#f7fbf7,#fff);font-size:12px;line-height:1.65;color:var(--muted);
}
.records.detail-open .log-detail{display:block}
.log-detail h6{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:6px}
.log-detail .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.log-detail .row span:last-child{color:var(--ink);font-weight:600;text-align:right}
.toast{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);
  background:rgba(27,46,28,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;
  opacity:0;pointer-events:none;transition:.25s;z-index:2000;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark">绿</div>
      <div>
        <h1>旧物捐赠地图</h1>
        <p>附近捐赠点 · 上门回收一站查询</p>
      </div>
    </div>
    <div class="eco-pill">本周已减少 1.2 吨废弃物</div>
  </header>
  <div class="workspace">
    <section class="panel map-panel">
      <div class="map-head">
        <div>
          <h2>附近捐赠点</h2>
          <div class="meta" id="loc-status">正在请求定位…</div>
        </div>
        <div class="map-tools">
          <span id="pin-count">6 个捐赠点</span>
          <button type="button" class="loc-btn" id="locate-btn">重新定位</button>
        </div>
      </div>
      <div class="map-wrap">
        <div class="map-canvas" id="map"></div>
        <div class="legend">
          <span><i class="a"></i>捐赠点</span>
          <span><i class="c"></i>当前选中</span>
          <span><i class="b"></i>我的位置</span>
        </div>
      </div>
    </section>
    <aside class="panel side">
      <div class="detail" id="detail"></div>
      <div class="form-box">
        <h4>预约上门回收</h4>
        <div class="field"><label>物品类型</label>
          <select id="item-type"><option>衣物鞋帽</option><option>书籍教材</option><option>小型家电</option><option>家具杂物</option></select>
        </div>
        <div class="field">
          <label>取件地址 <button type="button" id="use-loc-btn">填入当前位置</button></label>
          <input id="addr" placeholder="例：翠湖花园 3 栋 1202">
        </div>
        <div class="field"><label>期望时间</label><input id="when" placeholder="明天 10:00-12:00"></div>
        <div class="field"><label>备注</label><textarea id="note" rows="2" placeholder="是否需要搬运协助"></textarea></div>
        <button class="btn" id="book-btn">提交上门预约</button>
        <button class="btn ghost" id="nav-btn">导航前往该点</button>
        <div class="records expanded" id="records">
          <div class="records-head" id="records-toggle">
            <h5>我的记录 · 记录明细</h5>
            <span class="meta" id="records-meta">0 条</span>
          </div>
          <div class="records-body">
            <div id="logs"></div>
            <div class="log-detail" id="log-detail"></div>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/apps/_shared/geo.js"></script>
<script>
const POINT_DEFS=[
  {id:1,name:"翠湖社区旧物驿站",type:"衣物/书籍",addr:"社区服务中心一层",open:"09:00-18:00",accept:"衣物、书籍、玩具",door:false,dNorth:280,dEast:-180},
  {id:2,name:"绿行回收车 · 东站",type:"家电/家具",addr:"临时停靠区 · 可预约",open:"预约上门",accept:"家电、家具、大件",door:true,dNorth:120,dEast:920},
  {id:3,name:"高校公益捐赠柜",type:"衣物",addr:"学生活动中心南侧",open:"全天",accept:"衣物、书包",door:false,dNorth:-460,dEast:320},
  {id:4,name:"蓝鲸上门回收站",type:"综合",addr:"全市覆盖 · 当日可约",open:"08:00-20:00",accept:"综合旧物",door:true,dNorth:-720,dEast:-540},
  {id:5,name:"图书馆闲置书架",type:"书籍",addr:"读者服务区二楼",open:"10:00-17:00",accept:"书籍教材",door:false,dNorth:640,dEast:480},
  {id:6,name:"河岸环保驿站",type:"衣物/杂物",addr:"滨江步道休息亭",open:"周末 10:00-16:00",accept:"衣物、日用品",door:false,dNorth:-80,dEast:60}
];
const KEY="jw-donation-logs-v3";
let logs=[];
let points=[];
let active=null;
let selectedLogId=null;
let highlightId=null;
let userPos=null;
let userPlaceLabel="";
let map=null;
let meMarker=null;
const pinMarkers=new Map();
const Geo=()=>window.MashangChuangGeo;
const FALLBACK=()=>Geo()?.FALLBACK||{lat:30.2741,lng:120.1551,label:"杭州西湖附近"};

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(window.__t);window.__t=setTimeout(()=>el.classList.remove("show"),1800);
}
function saveLogs(){MashangChuangAuth.writeJSON(KEY,logs.slice(0,20));}
function nowStr(){return new Date().toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});}
function setLocStatus(text){document.getElementById("loc-status").textContent=text;}

async function fillAreaLabels(list){
  const G=Geo();
  if(!G||!list||!list.length) return;
  await Promise.all(list.map(async p=>{
    if(p.areaLabel) return;
    try{
      const place=await G.reverseGeocode(p.lat,p.lng);
      p.areaLabel=place.short||place.label||p.addr;
    }catch(e){
      p.areaLabel=p.addr;
    }
  }));
}

function pinIcon(isActive){
  return L.divIcon({
    className:"pin-icon",
    html:`<div class="pin-mark${isActive?" active":""}"></div>`,
    iconSize:[28,28],iconAnchor:[14,28]
  });
}
function meIcon(){
  return L.divIcon({className:"pin-icon",html:'<div class="me-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]});
}

function buildPoints(center){
  const G=Geo();
  return POINT_DEFS.map(d=>{
    const pos=G.offsetLatLng(center.lat,center.lng,d.dNorth,d.dEast);
    const meters=userPos?G.haversine(userPos,pos):G.haversine(center,pos);
    return Object.assign({},d,{lat:pos.lat,lng:pos.lng,meters,dist:G.formatDist(meters)});
  }).sort((a,b)=>a.meters-b.meters);
}

function ensureMap(center){
  if(map) return;
  map=L.map("map",{zoomControl:true,attributionControl:true}).setView([center.lat,center.lng],14);
  L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}",{
    maxZoom:18,
    subdomains:["1","2","3","4"],
    attribution:"&copy; 高德地图"
  }).addTo(map);
  setTimeout(()=>map.invalidateSize(),80);
}

function syncMarkers(){
  if(!map) return;
  pinMarkers.forEach(m=>map.removeLayer(m));
  pinMarkers.clear();
  points.forEach(p=>{
    const m=L.marker([p.lat,p.lng],{icon:pinIcon(active&&active.id===p.id),title:p.name})
      .addTo(map)
      .bindTooltip(p.name,{direction:"top",offset:[0,-24]});
    m.on("click",()=>{active=p;render(false);});
    pinMarkers.set(p.id,m);
  });
  if(userPos){
    if(meMarker) map.removeLayer(meMarker);
    meMarker=L.marker([userPos.lat,userPos.lng],{icon:meIcon(),zIndexOffset:1000,title:"我的位置"}).addTo(map);
  }
}

function fitNice(){
  if(!map||!points.length) return;
  const latlngs=points.map(p=>[p.lat,p.lng]);
  if(userPos) latlngs.push([userPos.lat,userPos.lng]);
  map.fitBounds(latlngs,{padding:[40,40],maxZoom:15});
}

function applyCenter(center,located){
  const fb=FALLBACK();
  points=buildPoints(center);
  if(!active||!points.find(p=>p.id===active.id)) active=points[0];
  else active=points.find(p=>p.id===active.id);
  ensureMap(center);
  syncMarkers();
  fitNice();
  document.getElementById("pin-count").textContent=points.length+" 个捐赠点";
  setLocStatus(located
    ?`已定位 · ${userPlaceLabel||"当前位置"}`
    :`未拿到定位 · 显示 ${fb.label}`);
  renderDetail();
  fillAreaLabels(points).then(()=>{ if(typeof renderDetail==="function") renderDetail(); });
}

function focusRecords(newId){
  const box=document.getElementById("records");
  box.classList.add("expanded","open");
  highlightId=newId;
  selectedLogId=newId;
  renderLogs();
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
  clearTimeout(window.__hi);window.__hi=setTimeout(()=>{
    highlightId=null;
    box.classList.remove("open");
    renderLogs();
  },2200);
}

function renderDetail(){
  const p=active;if(!p) return;
  const area=p.areaLabel||p.addr;
  document.getElementById("detail").innerHTML=`
    <div class="type">${p.type}${p.door?" · 可上门":" · 到店"}</div>
    <h3>${p.name}</h3>
    <p class="addr">${p.addr}<br>开放：${p.open} · 距离约 ${p.dist}<br>位置：${area}</p>
    <div class="facts">
      <div class="fact"><b>${p.accept}</b><span>可接收品类</span></div>
      <div class="fact"><b>${p.door?"支持上门":"仅到店"}</b><span>回收方式</span></div>
    </div>`;
}

function cancelLog(id){
  const l=logs.find(x=>x.id===id);if(!l)return;
  if(l.status==="已取消"){toast("该记录已取消");return}
  l.status="已取消";
  saveLogs();toast("记录已标记为已取消");
  selectedLogId=id;renderLogs();
}
function deleteLog(id){
  logs=logs.filter(x=>x.id!==id);
  saveLogs();toast("记录已删除");
  selectedLogId=null;renderLogs();
}
function renderLogDetail(){
  const box=document.getElementById("records");
  const detail=document.getElementById("log-detail");
  const l=logs.find(x=>x.id===selectedLogId);
  if(!l){box.classList.remove("detail-open");detail.innerHTML="";return}
  box.classList.add("detail-open");
  detail.innerHTML=`
    <h6>记录详情</h6>
    <div class="row"><span>类型</span><span>${l.kind}</span></div>
    <div class="row"><span>地点 / 地址</span><span>${l.place}</span></div>
    <div class="row"><span>时间</span><span>${l.time}</span></div>
    <div class="row"><span>状态</span><span>${l.status}</span></div>
    <div class="row"><span>内容</span><span>${l.detail}</span></div>
    ${l.pinName?`<div class="row"><span>关联捐赠点</span><span>${l.pinName}</span></div>`:""}
    ${l.note?`<div class="row"><span>备注</span><span>${l.note}</span></div>`:""}
    <div class="act-row">
      ${l.status!=="已取消"&&l.status!=="已完成"?`<button type="button" class="btn ghost" id="log-done">标记完成</button>`:""}
      ${l.status!=="已取消"?`<button type="button" class="btn ghost" id="log-cancel">取消记录</button>`:""}
      <button type="button" class="btn ghost" id="log-delete">删除记录</button>
    </div>`;
  document.getElementById("log-done")?.addEventListener("click",()=>{
    l.status="已完成";saveLogs();toast("已标记完成");renderLogs();
  });
  document.getElementById("log-cancel")?.addEventListener("click",()=>cancelLog(l.id));
  document.getElementById("log-delete")?.addEventListener("click",()=>deleteLog(l.id));
}
function renderLogs(){
  document.getElementById("records-meta").textContent=logs.length+" 条";
  const box=document.getElementById("logs");
  if(!logs.length){
    box.innerHTML='<div class="log-empty">暂无记录，预约或导航后会出现在这里</div>';
    selectedLogId=null;
    renderLogDetail();
    return;
  }
  box.innerHTML=logs.map(l=>`
    <button type="button" class="log-row${l.id===selectedLogId?" on":""}${l.id===highlightId?" hi":""}" data-id="${l.id}">
      <div>
        <span class="kind${l.kind==="上门预约"?" door":""}">${l.kind}</span>
        <b>${l.place}</b>
        <div class="sub">${l.time}</div>
      </div>
      <span class="status${l.status==="已取消"?" canceled":""}">${l.status}</span>
    </button>`).join("");
  renderLogDetail();
}
function render(refit){
  syncMarkers();
  renderDetail();
  renderLogs();
  if(refit) fitNice();
}

function locate(showToast){
  const btn=document.getElementById("locate-btn");
  const G=Geo();
  const fb=FALLBACK();
  btn.disabled=true;
  setLocStatus("正在请求定位…");
  if(!G){
    userPos=null;
    userPlaceLabel="";
    applyCenter(fb,false);
    btn.disabled=false;
    if(showToast) toast("定位组件未加载");
    return;
  }
  G.locateWithPlace().then(loc=>{
    if(loc.ok && !loc.fallback){
      userPos=loc.pos;
      userPlaceLabel=loc.placeLabel||loc.placeShort||"当前位置";
      applyCenter(userPos,true);
      if(showToast) toast("已更新为真实位置");
    } else {
      userPos=null;
      userPlaceLabel="";
      applyCenter(fb,false);
      const tip=loc.error==="denied"?"定位权限被拒绝":loc.error==="unsupported"?"当前环境不支持定位":"定位失败，已用默认区域";
      setLocStatus(tip+" · 显示 "+fb.label);
      if(showToast) toast(tip);
    }
  }).finally(()=>{btn.disabled=false});
}
document.getElementById("locate-btn").onclick=()=>locate(true);
document.getElementById("use-loc-btn").onclick=()=>{
  if(!userPos){toast("请先完成定位");return}
  document.getElementById("addr").value=userPlaceLabel
    ?("当前位置 · "+userPlaceLabel)
    :"当前位置附近";
  toast("已填入当前位置");
};
document.getElementById("records-toggle").onclick=()=>{
  document.getElementById("records").classList.toggle("expanded");
};
document.getElementById("logs").onclick=e=>{
  const row=e.target.closest("[data-id]");if(!row)return;
  selectedLogId=+row.dataset.id;
  document.getElementById("records").classList.add("expanded");
  renderLogs();
};
document.getElementById("book-btn").onclick=()=>{
  const addr=document.getElementById("addr").value.trim();
  if(!addr) return toast("请填写取件地址");
  const type=document.getElementById("item-type").value;
  const when=document.getElementById("when").value.trim()||"待确认";
  const note=document.getElementById("note").value.trim();
  const id=Date.now();
  logs.unshift({
    id,kind:"上门预约",place:addr,time:when+" · "+nowStr(),status:"已提交",
    detail:`预约回收「${type}」`,pinName:active.name,note:note||""
  });
  saveLogs();toast("上门预约已提交");
  document.getElementById("addr").value="";document.getElementById("note").value="";
  focusRecords(id);
};
document.getElementById("nav-btn").onclick=()=>{
  if(!active) return;
  const id=Date.now();
  logs.unshift({
    id,kind:"导航前往",place:active.name,time:nowStr(),status:"导航中",
    detail:`前往捐赠点「${active.name}」`,pinName:active.name,
    note:active.areaLabel?`${active.addr} · ${active.areaLabel}`:active.addr
  });
  saveLogs();
  if(Geo()) Geo().openNav({lat:active.lat,lng:active.lng,name:active.name});
  toast("已打开地图导航");
  focusRecords(id);
};

applyCenter(FALLBACK(),false);
locate(false);
</script>
