<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倒计时板</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1923;--bg2:#0a1420;--card:#1a2c3e;--panel:#15293a;
  --border:#2a4360;--txt:#e6f0fa;--txt2:#8aa4c0;--txt3:#5a7494;
  --accent:#4dd0e1;--accent2:#26a69a;--danger:#ff5252;--warn:#ffb74b;--ok:#66bb6a;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
html,body{height:100%}
body{
  background:radial-gradient(1200px 600px at 80% -10%,#15293a 0%,var(--bg) 60%),var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  min-height:100vh;padding:18px;line-height:1.5;
}
.wrap{max-width:1100px;margin:0 auto}

/* 顶部 */
.header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  flex-wrap:wrap;margin-bottom:22px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{
  width:46px;height:46px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:24px;
  box-shadow:0 4px 16px rgba(77,208,225,.35);
}
.brand h1{font-size:22px;font-weight:700;letter-spacing:1px}
.brand h1 small{display:block;font-size:12px;color:var(--txt3);font-weight:400;letter-spacing:0}
.clock{
  font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--accent);text-shadow:0 0 24px rgba(77,208,225,.4);
  letter-spacing:1px;
}
.clock .lab{font-size:12px;color:var(--txt3);font-weight:400;display:block;letter-spacing:2px;margin-bottom:2px}
.add-btn{
  cursor:pointer;border:none;border-radius:12px;padding:12px 22px;
  font-size:15px;font-weight:600;color:#062028;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 4px 16px rgba(77,208,225,.35);transition:.18s;
}
.add-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.add-btn:active{transform:translateY(1px)}

/* 卡片列表 - 纯垂直排布 */
.list{display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
.empty{
  grid-column:1/-1;text-align:center;color:var(--txt2);padding:70px 20px;
  font-size:16px;border:1px dashed var(--border);border-radius:16px;background:rgba(255,255,255,.02)
}
.empty .big{font-size:56px;display:block;margin-bottom:14px;opacity:.6}

/* 卡片 */
.card{
  position:relative;border-radius:16px;padding:18px 18px 14px;
  border:1px solid var(--border);box-shadow:var(--shadow);
  overflow:hidden;animation:fadein .35s ease;transition:transform .2s,box-shadow .2s;
  background:var(--card);
}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.card.dragging{opacity:.4;transform:scale(.97)}
.card.drag-over{border-top:3px solid var(--accent);margin-top:-3px}
.card[draggable=true]{cursor:grab}
.card[draggable=true]:active{cursor:grabbing}
.card.has-bg::before{
  content:"";position:absolute;inset:0;background:rgba(10,20,32,.55);pointer-events:none;z-index:0;
}
.card.has-bg .card-inner{position:relative;z-index:1}
.card.pinned{box-shadow:0 0 0 2px var(--accent) inset,var(--shadow)}
.card.expired{border-color:#5a2030}
@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.pin-mark{
  position:absolute;top:10px;left:10px;font-size:16px;opacity:0;transition:.2s;z-index:2;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));
}
.card.pinned .pin-mark{opacity:1}

.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.card-name{font-size:19px;font-weight:700;word-break:break-all;flex:1}
.card-desc{font-size:13px;color:var(--txt2);margin-bottom:12px;word-break:break-all;min-height:0}
.card-desc:empty{display:none}
.card-target{font-size:12px;color:var(--txt3);margin-bottom:14px}
.card-target b{color:var(--txt2);font-weight:500}

/* 倒计时数字 */
.cd{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.unit{text-align:center;min-width:58px}
.digit{
  font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;
  display:inline-block;transition:transform .2s;
  text-shadow:0 2px 12px rgba(0,0,0,.4);
}
.digit.tick{animation:tickanim .35s ease}
@keyframes tickanim{0%{transform:translateY(0)}40%{transform:translateY(-6px);opacity:.6}100%{transform:translateY(0)}}
.lab{font-size:11px;color:var(--txt3);margin-top:5px;letter-spacing:1px}
.card.expired .digit{color:var(--danger)}
.badge{
  display:inline-block;background:var(--danger);color:#fff;font-size:11px;
  padding:2px 9px;border-radius:10px;margin-left:8px;vertical-align:middle;font-weight:600;
}
.expired-info{color:var(--danger);font-size:13px;text-align:center;margin-top:6px;font-weight:500}

/* 操作栏 */
.actions{
  display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;
  border-top:1px solid rgba(255,255,255,.06);padding-top:10px;margin-top:8px;
}
.act{
  cursor:pointer;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);
  color:var(--txt2);border-radius:8px;padding:6px 9px;font-size:13px;
  transition:.15s;display:inline-flex;align-items:center;gap:4px;line-height:1;
}
.act:hover{background:rgba(77,208,225,.15);color:var(--accent);border-color:var(--accent)}
.act.danger:hover{background:rgba(255,82,82,.18);color:var(--danger);border-color:var(--danger)}
.act.active{background:rgba(77,208,225,.2);color:var(--accent);border-color:var(--accent)}

/* 模态框 */
.mask{
  position:fixed;inset:0;background:rgba(5,10,18,.7);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
  animation:maskin .2s ease;
}
@keyframes maskin{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  width:100%;max-width:460px;max-height:90vh;overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.6);animation:modalin .25s ease;
}
@keyframes modalin{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 20px;border-bottom:1px solid var(--border);
}
.modal-head h3{font-size:17px;font-weight:600}
.modal-head .close{
  cursor:pointer;border:none;background:transparent;color:var(--txt2);
  font-size:22px;line-height:1;padding:4px 8px;border-radius:8px;
}
.modal-head .close:hover{background:rgba(255,255,255,.08);color:var(--txt)}
.modal-body{padding:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--txt2);margin-bottom:6px}
.field input[type=text],.field input[type=datetime-local],.field textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;color:var(--txt);font-size:15px;transition:.2s;font-family:inherit;
}
.field textarea{resize:vertical;min-height:60px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,208,225,.18)}
.field input[type=datetime-local]{color-scheme:dark}
.modal-foot{
  display:flex;justify-content:flex-end;gap:10px;padding:0 20px 20px;
}
.btn{
  cursor:pointer;border:none;border-radius:10px;padding:10px 20px;
  font-size:14px;font-weight:600;transition:.18s;font-family:inherit;
}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#062028}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--txt2)}
.btn-ghost:hover{background:rgba(255,255,255,.06);color:var(--txt)}
.btn-danger{background:linear-gradient(135deg,#ff5252,#c62828);color:#fff}
.btn-danger:hover{filter:brightness(1.1)}

/* 主题选择 */
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.theme-opt{
  cursor:pointer;border-radius:10px;height:42px;border:2px solid transparent;
  transition:.15s;position:relative;overflow:hidden;
}
.theme-opt.sel{border-color:#fff;transform:scale(1.05)}
.theme-opt .tn{
  position:absolute;bottom:2px;left:0;right:0;text-align:center;
  font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);
}

/* 背景图设置 */
.bg-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bg-row input[type=file]{display:none}
.upload-btn{
  cursor:pointer;border:1px dashed var(--border);background:var(--bg);color:var(--txt2);
  border-radius:10px;padding:10px 14px;font-size:13px;transition:.15s;
}
.upload-btn:hover{border-color:var(--accent);color:var(--accent)}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{flex:1;accent-color:var(--accent)}
.range-val{font-size:13px;color:var(--accent);min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.bg-preview{margin-top:8px;border-radius:8px;max-height:80px;overflow:hidden;border:1px solid var(--border)}
.bg-preview img{display:block;width:100%;height:80px;object-fit:cover}
.clear-bg{cursor:pointer;background:transparent;border:none;color:var(--danger);font-size:12px;padding:4px 8px;border-radius:6px}
.clear-bg:hover{background:rgba(255,82,82,.15)}

/* 确认弹窗 */
.confirm-modal{max-width:360px;text-align:center}
.confirm-modal .modal-body{padding:24px 20px}
.confirm-modal .icon{font-size:42px;margin-bottom:10px}
.confirm-modal p{color:var(--txt);margin-bottom:20px;font-size:15px}

/* 响应式 */
@media(max-width:600px){
  body{padding:12px}
  .header{margin-bottom:16px}
  .clock{font-size:22px}
  .brand h1{font-size:18px}
  .digit{font-size:32px}
  .unit{min-width:48px}
  .card-name{font-size:17px}

  .add-btn{padding:10px 16px;font-size:14px}
}
@media(max-width:380px){
  .digit{font-size:26px}
  .unit{min-width:40px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">
      <div class="logo">⏰</div>
      <h1>倒计时板<small>记录每一个重要时刻</small></h1>
    </div>
    <div class="clock"><span class="lab">当前时间</span><span id="nowClock">--</span></div>
    <button class="add-btn" id="addBtn">＋ 添加事件</button>
  </div>
  <div class="list" id="listArea"></div>
</div>
<div id="modalRoot"></div>
<script>
(function(){
"use strict";

/* ===================== 常量与主题 ===================== */
var KEY = "countdown_events";
var THEMES = {
  blue:   { name:"深海蓝", grad:"linear-gradient(135deg,#1a3a5c,#0d2440)", accent:"#4dd0e1", border:"#2a5a7a" },
  purple: { name:"星夜紫", grad:"linear-gradient(135deg,#3a1a5c,#1d0d40)", accent:"#b388ff", border:"#5a2a7a" },
  green:  { name:"森林绿", grad:"linear-gradient(135deg,#1a4a3a,#0d3020)", accent:"#66bb6a", border:"#2a6a4a" },
  orange: { name:"日落橙", grad:"linear-gradient(135deg,#5c3a1a,#40200d)", accent:"#ffb74b", border:"#7a5a2a" },
  pink:   { name:"樱花粉", grad:"linear-gradient(135deg,#5c1a3a,#400d24)", accent:"#f48fb1", border:"#7a2a4a" },
  cyan:   { name:"青碧色", grad:"linear-gradient(135deg,#1a4a4a,#0d3030)", accent:"#26c6da", border:"#2a6a6a" },
  red:    { name:"熔岩红", grad:"linear-gradient(135deg,#5c1a1a,#400d0d)", accent:"#ef5350", border:"#7a2a2a" },
  indigo: { name:"靛蓝夜", grad:"linear-gradient(135deg,#2a2a5c,#151540)", accent:"#7986cb", border:"#4a4a7a" },
  aurora:  { name:"极光绿", grad:"linear-gradient(135deg,#0d4040,#1a6a3a 40%,#0d3070)", accent:"#80ffea", border:"#2a6a5a" },
  sunset:  { name:"晚霞红", grad:"linear-gradient(135deg,#5c2a1a,#a04020 50%,#5c1a3a)", accent:"#ff8a65", border:"#7a4a2a" },
  galaxy:  { name:"银河紫", grad:"linear-gradient(135deg,#1a0d3a,#3a1a6c 50%,#0d2a5c)", accent:"#b388ff", border:"#4a2a7a" },
  flame:   { name:"火焰橙", grad:"linear-gradient(135deg,#5c1a0d,#c04010 50%,#a03020)", accent:"#ff7043", border:"#7a3a1a" },
  ocean:   { name:"深海青", grad:"linear-gradient(135deg,#0d3a5c,#1a6a8a 50%,#0d4a6a)", accent:"#4fc3f7", border:"#2a5a7a" },
  rainbow: { name:"彩虹渐变", grad:"linear-gradient(135deg,#5c1a4a,#5c3a1a 33%,#1a5c3a 66%,#1a3a5c)", accent:"#ce93d8", border:"#4a4a6a" },
  gold:    { name:"流金岁月", grad:"linear-gradient(135deg,#4a3a10,#8a6a20 50%,#6a4a10)", accent:"#ffd54f", border:"#6a5a2a" }
};

/* ===================== 工具函数 ===================== */
function $(id){ return document.getElementById(id); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function pad(n){ return (n<10?"0":"")+n; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]}); }
function fmtDateTime(s){
  var d=new Date(s);
  if(isNaN(d)) return "—";
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function fmtNow(d){
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+
         pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}
function diffParts(from,to){
  var ms=to-from, neg=ms<0;
  ms=Math.abs(ms);
  var s=Math.floor(ms/1000);
  var dd=Math.floor(s/86400); s-=dd*86400;
  var h=Math.floor(s/3600); s-=h*3600;
  var m=Math.floor(s/60); s-=m*60;
  return { neg:neg, d:dd, h:h, m:m, s:s };
}
function expiredText(p){
  var txt="";
  if(p.d>0) txt+=p.d+"天 ";
  if(p.h>0||p.d>0) txt+=p.h+"时 ";
  txt+=p.m+"分 "+p.s+"秒";
  return txt;
}

/* ===================== 存储 ===================== */
function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ return []; }
}
function save(arr){
  try{ localStorage.setItem(KEY,JSON.stringify(arr)); return true; }
  catch(e){ toast("存储失败，背景图可能过大"); return false; }
}

/* ===================== 排序 ===================== */
function sortEvents(arr){
  return arr.slice().sort(function(a,b){
    if(!!a.pinned !== !!b.pinned) return a.pinned?-1:1;
    return (a.order||0)-(b.order||0);
  });
}
function saveOrderFromDOM(){
  var arr=load();
  var cards=document.querySelectorAll(".card");
  cards.forEach(function(c,i){
    var id=c.dataset.id;
    for(var j=0;j<arr.length;j++){
      if(arr[j].id===id){arr[j].order=i;break;}
    }
  });
  save(arr);
}

/* ===================== 图片压缩 ===================== */
function compressImage(file, cb){
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var maxW=800, w=img.width, h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      var c=document.createElement("canvas");
      c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      try{ cb(c.toDataURL("image/jpeg",0.82)); }
      catch(e){ toast("图片处理失败"); }
    };
    img.onerror=function(){ toast("图片加载失败"); };
    img.src=reader.result;
  };
  reader.onerror=function(){ toast("读取文件失败"); };
  reader.readAsDataURL(file);
}

/* ===================== 轻提示 ===================== */
var toastTimer=null;
function toast(msg){
  var t=$("toastEl");
  if(!t){
    t=document.createElement("div");
    t.id="toastEl";
    t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a2c3e;color:#e6f0fa;padding:10px 20px;border-radius:10px;border:1px solid #2a4360;z-index:200;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:opacity .25s";
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.opacity="1";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.style.opacity="0"; },2200);
}

/* ===================== 卡片引用表 ===================== */
var cardRefs = {}; // id -> { el, digits:{d,h,m,s}, expiredBadge, expiredInfo, lastVals }

/* ===================== 渲染卡片列表（仅数据变化时调用）===================== */
function renderCards(){
  var arr = sortEvents(load());
  var listArea = $("listArea");
  cardRefs = {};

  if(arr.length===0){
    listArea.innerHTML = '<div class="empty"><span class="big">⏳</span>暂无倒计时事件<br><small style="color:var(--txt3)">点击右上角「添加事件」开始记录</small></div>';
    return;
  }

  listArea.innerHTML = "";
  for(var i=0;i<arr.length;i++){
    var ref = createCard(arr[i], i, arr.length);
    listArea.appendChild(ref.el);
    cardRefs[arr[i].id] = ref;
  }
  updateAllDigits();
}

/* ===================== 创建单张卡片 ===================== */
function createCard(e, idx, total){
  var theme = THEMES[e.theme] || THEMES.blue;

  var card = document.createElement("div");
  card.className = "card" + (e.pinned?" pinned":"");
  card.dataset.id = e.id;
  card.draggable = true;

  card.addEventListener("dragstart",function(ev){
    card.classList.add("dragging");
    ev.dataTransfer.effectAllowed="move";
    ev.dataTransfer.setData("text/plain",e.id);
  });
  card.addEventListener("dragend",function(){
    card.classList.remove("dragging");
    document.querySelectorAll(".card").forEach(function(c){c.classList.remove("drag-over")});
    saveOrderFromDOM();
  });
  card.addEventListener("dragover",function(ev){
    ev.preventDefault();
    ev.dataTransfer.dropEffect="move";
    var dragging=document.querySelector(".dragging");
    if(!dragging||dragging===card)return;
    document.querySelectorAll(".card").forEach(function(c){c.classList.remove("drag-over")});
    var rect=card.getBoundingClientRect();
    if(ev.clientY<rect.top+rect.height/2){
      card.classList.add("drag-over");
    }
  });
  card.addEventListener("drop",function(ev){
    ev.preventDefault();
    var dragging=document.querySelector(".dragging");
    if(!dragging||dragging===card)return;
    var rect=card.getBoundingClientRect();
    if(ev.clientY<rect.top+rect.height/2){
      card.parentNode.insertBefore(dragging,card);
    }else{
      card.parentNode.insertBefore(dragging,card.nextSibling);
    }
  });

  // 背景
  if(e.bgImage){
    card.style.backgroundImage = "url('"+e.bgImage+"')";
    card.style.backgroundSize = "cover";
    card.style.backgroundPosition = "center";
    card.classList.add("has-bg");
  } else {
    card.style.background = theme.grad;
  }
  card.style.borderColor = e.pinned ? theme.accent : (e.bgImage ? "rgba(255,255,255,.12)" : theme.border);

  // 内部结构
  var inner = document.createElement("div");
  inner.className = "card-inner";

  var pinMark = document.createElement("div");
  pinMark.className = "pin-mark";
  pinMark.textContent = "📌";
  card.appendChild(pinMark);

  // 头部
  var head = document.createElement("div");
  head.className = "card-head";
  var nameWrap = document.createElement("div");
  nameWrap.style.flex = "1";
  var dragHint = document.createElement("span");
  dragHint.style.cssText = "color:var(--txt3);font-size:14px;margin-right:6px;cursor:grab;user-select:none";
  dragHint.textContent = "⠿";
  dragHint.title = "拖动排序";
  nameWrap.appendChild(dragHint);
  var name = document.createElement("span");
  name.className = "card-name";
  name.textContent = e.name;
  nameWrap.appendChild(name);
  var badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = "已结束";
  badge.style.display = "none";
  nameWrap.appendChild(badge);
  head.appendChild(nameWrap);
  inner.appendChild(head);

  // 描述
  var desc = document.createElement("div");
  desc.className = "card-desc";
  desc.textContent = e.description || "";
  inner.appendChild(desc);

  // 目标时间
  var target = document.createElement("div");
  target.className = "card-target";
  target.innerHTML = "目标时间　<b>"+esc(fmtDateTime(e.targetTime))+"</b>";
  inner.appendChild(target);

  // 倒计时数字
  var cd = document.createElement("div");
  cd.className = "cd";
  var digits = {};
  var units = [["d","天"],["h","时"],["m","分"],["s","秒"]];
  for(var k=0;k<units.length;k++){
    var u = document.createElement("div");
    u.className = "unit";
    var dig = document.createElement("span");
    dig.className = "digit";
    dig.textContent = "00";
    u.appendChild(dig);
    var lab = document.createElement("div");
    lab.className = "lab";
    lab.textContent = units[k][1];
    u.appendChild(lab);
    cd.appendChild(u);
    digits[units[k][0]] = dig;
  }
  inner.appendChild(cd);

  // 过期信息
  var expiredInfo = document.createElement("div");
  expiredInfo.className = "expired-info";
  expiredInfo.style.display = "none";
  inner.appendChild(expiredInfo);

  // 操作栏
  var actions = document.createElement("div");
  actions.className = "actions";
  var btnDef = [
    { key:"pin",  text:e.pinned?"取消置顶":"置顶", icon:"📌", act:togglePin, active:e.pinned },
    { key:"up",   text:"上移", icon:"↑", act:moveUp },
    { key:"down", text:"下移", icon:"↓", act:moveDown },
    { key:"edit", text:"编辑", icon:"✎", act:editCard },
    { key:"set",  text:"设置", icon:"⚙", act:openSettings },
    { key:"del",  text:"删除", icon:"✕", act:confirmDelete, danger:true }
  ];
  for(var b=0;b<btnDef.length;b++){
    (function(def){
      var btn = document.createElement("button");
      btn.className = "act" + (def.danger?" danger":"") + (def.active?" active":"");
      btn.innerHTML = '<span>'+def.icon+'</span><span>'+def.text+'</span>';
      btn.onclick = function(){ def.act(e.id); };
      actions.appendChild(btn);
      if(def.key==="pin") btn.dataset.pinBtn = "1";
    })(btnDef[b]);
  }
  inner.appendChild(actions);

  card.appendChild(inner);

  return {
    el: card,
    digits: digits,
    badge: badge,
    expiredInfo: expiredInfo,
    pinBtn: actions.querySelector('[data-pin-btn="1"]'),
    lastVals: {}
  };
}

/* ===================== 每秒更新数字（不重建DOM）===================== */
function updateAllDigits(){
  var now = Date.now();
  for(var id in cardRefs){
    var ref = cardRefs[id];
    var arr = load();
    var e = null;
    for(var i=0;i<arr.length;i++){ if(arr[i].id===id){ e=arr[i]; break; } }
    if(!e){ continue; }
    var t = new Date(e.targetTime).getTime();
    var expired = t < now;
    var p = diffParts(now, t);

    var vals = { d:pad(p.d), h:pad(p.h), m:pad(p.m), s:pad(p.s) };
    for(var k in vals){
      if(ref.lastVals[k] !== vals[k]){
        ref.digits[k].textContent = vals[k];
        ref.digits[k].classList.remove("tick");
        void ref.digits[k].offsetWidth;
        ref.digits[k].classList.add("tick");
        ref.lastVals[k] = vals[k];
      }
    }

    // 过期状态
    if(expired){
      ref.el.classList.add("expired");
      ref.badge.style.display = "inline-block";
      ref.expiredInfo.style.display = "block";
      ref.expiredInfo.textContent = "已过期 " + expiredText(p);
    } else {
      ref.el.classList.remove("expired");
      ref.badge.style.display = "none";
      ref.expiredInfo.style.display = "none";
    }
  }
}

/* ===================== 当前时间 ===================== */
function updateClock(){
  $("nowClock").textContent = fmtNow(new Date());
}

/* ===================== 操作：置顶 ===================== */
function togglePin(id){
  var arr = load();
  for(var i=0;i<arr.length;i++){
    if(arr[i].id===id){ arr[i].pinned = !arr[i].pinned; break; }
  }
  save(arr);
  renderCards();
}

/* ===================== 操作：上移/下移 ===================== */
function moveUp(id){ swapOrder(id, -1); }
function moveDown(id){ swapOrder(id, 1); }
function swapOrder(id, dir){
  var arr = load();
  var sorted = sortEvents(arr);
  // 找到当前在排序后数组中的位置
  var pos = -1;
  for(var i=0;i<sorted.length;i++){ if(sorted[i].id===id){ pos=i; break; } }
  if(pos<0) return;
  var target = pos + dir;
  if(target<0 || target>=sorted.length) return;
  // 不能跨置顶/非置顶组移动
  if(!!sorted[pos].pinned !== !!sorted[target].pinned){ toast("置顶与未置顶分组排序"); return; }
  // 交换 order
  var a = sorted[pos], b = sorted[target];
  var ao = a.order||0, bo = b.order||0;
  // 在原数组中找到并交换 order
  for(var j=0;j<arr.length;j++){
    if(arr[j].id===a.id) arr[j].order = bo;
    if(arr[j].id===b.id) arr[j].order = ao;
  }
  save(arr);
  renderCards();
}

/* ===================== 操作：编辑 ===================== */
function editCard(id){
  var arr = load();
  var e = null;
  for(var i=0;i<arr.length;i++){ if(arr[i].id===id){ e=arr[i]; break; } }
  if(!e) return;
  openFormModal(e);
}

/* ===================== 操作：删除确认 ===================== */
function confirmDelete(id){
  var arr = load();
  var e = null;
  for(var i=0;i<arr.length;i++){ if(arr[i].id===id){ e=arr[i]; break; } }
  if(!e) return;
  openConfirm("确认删除「"+e.name+"」？", "删除后无法恢复", function(){
    var arr2 = load().filter(function(x){ return x.id!==id; });
    save(arr2);
    renderCards();
  });
}

/* ===================== 操作：设置面板 ===================== */
function openSettings(id){
  var arr = load();
  var e = null;
  for(var i=0;i<arr.length;i++){ if(arr[i].id===id){ e=arr[i]; break; } }
  if(!e) return;
  openSettingsModal(e);
}

/* ===================== 模态框基础 ===================== */
function closeModal(){
  var root = $("modalRoot");
  root.innerHTML = "";
}
function openModal(headTitle, bodyHtml, footHtml){
  var root = $("modalRoot");
  root.innerHTML =
    '<div class="mask" id="theMask">'+
      '<div class="modal" id="theModal">'+
        '<div class="modal-head"><h3>'+esc(headTitle)+'</h3><button class="close" id="modalClose">×</button></div>'+
        '<div class="modal-body">'+bodyHtml+'</div>'+
        (footHtml?'<div class="modal-foot">'+footHtml+'</div>':'')+
      '</div>'+
    '</div>';
  $("modalClose").onclick = closeModal;
  $("theMask").onclick = function(ev){ if(ev.target===this) closeModal(); };
  document.addEventListener("keydown", escCloseModal);
}
function escCloseModal(ev){ if(ev.key==="Escape"){ closeModal(); document.removeEventListener("keydown", escCloseModal); } }

/* ===================== 添加/编辑模态框 ===================== */
function openAddModal(){ openFormModal(null); }
function openFormModal(existing){
  var isEdit = !!existing;
  var e = existing || { name:"", targetTime:"", description:"" };
  // 默认时间：当前+1天，取本地时间字符串
  if(!e.targetTime){
    var d = new Date(Date.now()+86400000);
    e.targetTime = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());
  }
  var body =
    '<div class="field"><label>事件名称</label>'+
      '<input type="text" id="fName" maxlength="40" value="'+esc(e.name)+'" placeholder="如：期末考试"></div>'+
    '<div class="field"><label>目标日期时间</label>'+
      '<input type="datetime-local" id="fTime" value="'+esc(e.targetTime)+'"></div>'+
    '<div class="field"><label>描述 / 激励语（可选）</label>'+
      '<textarea id="fDesc" maxlength="120" placeholder="写一句话激励自己">'+esc(e.description||"")+'</textarea></div>';
  var foot =
    '<button class="btn btn-ghost" id="fCancel">取消</button>'+
    '<button class="btn btn-primary" id="fSave">'+(isEdit?"保存":"添加")+'</button>';
  openModal(isEdit?"编辑事件":"添加事件", body, foot);

  $("fCancel").onclick = closeModal;
  $("fSave").onclick = function(){
    var n = $("fName").value.trim();
    var t = $("fTime").value;
    var d = $("fDesc").value.trim();
    if(!n){ toast("请填写事件名称"); $("fName").focus(); return; }
    if(!t){ toast("请选择目标时间"); $("fTime").focus(); return; }
    var arr = load();
    if(isEdit){
      for(var i=0;i<arr.length;i++){
        if(arr[i].id===e.id){
          arr[i].name=n; arr[i].targetTime=t; arr[i].description=d;
          break;
        }
      }
    } else {
      var maxOrder = 0;
      for(var j=0;j<arr.length;j++){ if((arr[j].order||0)>maxOrder) maxOrder=arr[j].order||0; }
      arr.push({
        id: uid(), name:n, targetTime:t, description:d,
        pinned:false, order:maxOrder+1, theme:"blue", bgImage:null, bgOpacity:0.5
      });
    }
    if(save(arr)){ closeModal(); renderCards(); }
  };
  $("fName").focus();
}

/* ===================== 设置模态框 ===================== */
function openSettingsModal(e){
  var themeKeys = Object.keys(THEMES);
  var themeHtml = '<div class="theme-grid">';
  for(var i=0;i<themeKeys.length;i++){
    var tk = themeKeys[i], th = THEMES[tk];
    themeHtml += '<div class="theme-opt'+(e.theme===tk?" sel":"")+'" data-theme="'+tk+'" style="background:'+th.grad+'">'+
      '<div class="tn">'+th.name+'</div></div>';
  }
  themeHtml += '</div>';

  var body =
    '<div class="field"><label>预设主题</label>'+themeHtml+'</div>'+
    '<div class="field"><label>自定义背景图 <small style="color:var(--txt3);font-weight:400">建议 560×300px，2:1 宽高比</small></label>'+
      '<div class="bg-row">'+
        '<label class="upload-btn" for="bgFile">选择图片…</label>'+
        '<input type="file" id="bgFile" accept="image/png,image/jpeg,image/jpg">'+
        (e.bgImage?'<button class="clear-bg" id="clearBg">清除背景</button>':'')+
      '</div>'+
      '<div class="bg-preview" id="bgPreview" style="'+(e.bgImage?'':'display:none')+'">'+
        (e.bgImage?'<img src="'+esc(e.bgImage)+'">':'')+
      '</div>'+
    '</div>'+
    '<div class="field"><label>背景图遮罩透明度</label>'+
      '<div class="range-row">'+
        '<input type="range" id="bgOp" min="0" max="100" value="'+Math.round((e.bgOpacity==null?0.5:e.bgOpacity)*100)+'">'+
        '<span class="range-val" id="bgOpVal">'+Math.round((e.bgOpacity==null?0.5:e.bgOpacity)*100)+'%</span>'+
      '</div>'+
    '</div>';
  var foot =
    '<button class="btn btn-ghost" id="sCancel">取消</button>'+
    '<button class="btn btn-primary" id="sSave">保存设置</button>';
  openModal("卡片设置", body, foot);

  var curTheme = e.theme || "blue";
  var curBg = e.bgImage || null;
  var curOp = e.bgOpacity==null?0.5:e.bgOpacity;

  var opts = document.querySelectorAll(".theme-opt");
  for(var k=0;k<opts.length;k++){
    opts[k].onclick = function(){
      for(var m=0;m<opts.length;m++) opts[m].classList.remove("sel");
      this.classList.add("sel");
      curTheme = this.dataset.theme;
    };
  }

  $("bgOp").oninput = function(){
    curOp = parseInt(this.value,10)/100;
    $("bgOpVal").textContent = this.value+"%";
  };

  $("bgFile").onchange = function(){
    var f = this.files[0];
    if(!f) return;
    if(f.size > 8*1024*1024){ toast("图片过大，请选小于8MB的图"); return; }
    compressImage(f, function(dataUrl){
      curBg = dataUrl;
      var pv = $("bgPreview");
      pv.style.display = "block";
      pv.innerHTML = '<img src="'+dataUrl+'">';
    });
  };

  if(e.bgImage){
    var cb = $("clearBg");
    if(cb) cb.onclick = function(){
      curBg = null;
      $("bgPreview").style.display = "none";
      $("bgPreview").innerHTML = "";
      if(!$("clearBg2")){
        var btn = document.createElement("button");
        btn.className="clear-bg"; btn.id="clearBg2"; btn.textContent="已清除";
        btn.disabled = true;
        cb.parentNode.replaceChild(btn, cb);
      }
    };
  }

  $("sCancel").onclick = closeModal;
  $("sSave").onclick = function(){
    var arr = load();
    for(var i=0;i<arr.length;i++){
      if(arr[i].id===e.id){
        arr[i].theme = curTheme;
        arr[i].bgImage = curBg;
        arr[i].bgOpacity = curOp;
        break;
      }
    }
    if(save(arr)){ closeModal(); renderCards(); }
  };
}

/* ===================== 确认弹框 ===================== */
function openConfirm(title, desc, onOk){
  var body =
    '<div class="icon">⚠️</div>'+
    '<p style="font-weight:600;margin-bottom:6px">'+esc(title)+'</p>'+
    '<p style="color:var(--txt2);font-size:13px">'+esc(desc)+'</p>';
  var foot =
    '<button class="btn btn-ghost" id="cCancel">取消</button>'+
    '<button class="btn btn-danger" id="cOk">确认删除</button>';
  var root = $("modalRoot");
  root.innerHTML =
    '<div class="mask" id="theMask">'+
      '<div class="modal confirm-modal" id="theModal">'+
        '<div class="modal-body">'+body+'</div>'+
        '<div class="modal-foot">'+foot+'</div>'+
      '</div>'+
    '</div>';
  $("theMask").onclick = function(ev){ if(ev.target===this) closeModal(); };
  $("cCancel").onclick = closeModal;
  $("cOk").onclick = function(){ closeModal(); onOk(); };
  document.addEventListener("keydown", escCloseModal);
}

/* ===================== 事件绑定 ===================== */
$("addBtn").onclick = openAddModal;

/* ===================== 启动 ===================== */
updateClock();
renderCards();
setInterval(function(){ updateClock(); updateAllDigits(); }, 1000);

})();
</script>
