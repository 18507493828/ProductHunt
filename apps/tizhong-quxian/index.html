<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>体重曲线</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232fb3a3'/%3E%3Cpath d='M12 40l12-12 8 8 20-20' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --accent:#2fb3a3;--accent2:#3f8fc9;--glow:rgba(47,179,163,.32);
  --txt:#26343c;--txt2:#5f727c;--txt3:#94a5ae;
  --border:rgba(110,140,145,.18);
  --card:rgba(255,255,255,.82);
  --soft:rgba(47,179,163,.10);
  --green:#4caf78;--red:#e06550;--warn:#e09a50;
}
html{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--txt);
  background:linear-gradient(168deg,#f2f9f7 0%,#e9f2f1 48%,#eef3f9 100%);
  background-attachment:fixed;
  min-height:100vh;display:flex;justify-content:center;padding:24px 16px 46px;
}
.app{width:100%;max-width:620px;display:flex;flex-direction:column;gap:14px;animation:pagein .55s ease both}
@keyframes pagein{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;backdrop-filter:blur(10px)}

/* ===== 头部 ===== */
.title{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#56c6b6,#2f9c8f);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px var(--glow);flex-shrink:0}
h1{font-size:21px;font-weight:700;letter-spacing:2px}
.title p{font-size:12px;color:var(--txt3);margin-top:2px}
.intro{font-size:13px;color:var(--txt2);line-height:1.8;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 15px;backdrop-filter:blur(10px)}
.intro b{color:var(--accent)}
.sec-title{font-size:14px;font-weight:600;color:var(--txt2);letter-spacing:1px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.sec-title .hint{font-size:11px;color:var(--txt3);font-weight:400;letter-spacing:0}

/* ===== 表单 ===== */
.add-form{display:flex;flex-direction:column;gap:11px}
.form-row{display:flex;gap:10px;flex-wrap:wrap}
.form-row>*{flex:1;min-width:96px}
.input-group{display:flex;flex-direction:column;gap:5px}
.input-group label{font-size:12px;color:var(--txt3)}
input[type=text],input[type=number],input[type=date]{padding:10px 12px;border:1.5px solid var(--border);background:rgba(246,250,249,.85);color:var(--txt);border-radius:10px;font-size:15px;font-family:inherit;transition:border-color .25s,box-shadow .25s;width:100%;color-scheme:light;font-variant-numeric:tabular-nums}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.btn{padding:11px 16px;border:none;border-radius:11px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .2s ease,filter .2s,box-shadow .2s;letter-spacing:1px}
.btn-add{background:linear-gradient(135deg,#56c6b6,#2f9c8f);color:#fff;flex:0 0 auto;box-shadow:0 8px 20px var(--glow)}
.btn-add:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn-add:active{transform:translateY(1px)}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--txt2);box-shadow:none}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--soft)}

/* ===== 图表 ===== */
.chart-card{position:relative}
#chartCanvas{width:100%;height:280px;display:block;cursor:crosshair}
.empty-chart{text-align:center;color:var(--txt3);padding:60px 20px;font-size:14px;line-height:1.8}
.tooltip{position:absolute;background:rgba(255,255,255,.96);border:1.5px solid var(--accent);border-radius:10px;padding:8px 12px;font-size:13px;pointer-events:none;white-space:nowrap;z-index:10;box-shadow:0 8px 24px rgba(40,90,80,.18);display:none}
.tooltip .tt-date{color:var(--accent);font-weight:700}
.tooltip .tt-weight{font-size:16px;font-weight:800;margin:4px 0;color:var(--txt)}
.tooltip .tt-note{color:var(--txt3);font-size:11px}

/* ===== 统计 ===== */
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.stat{text-align:center;padding:11px 6px;background:rgba(246,250,249,.7);border:1px solid var(--border);border-radius:12px}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:10.5px;color:var(--txt3);margin-top:3px}
.stat.up .v{color:var(--red)}
.stat.down .v{color:var(--green)}
.stat.neutral .v{color:var(--accent)}

/* ===== 目标 ===== */
.goal-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}
.goal-row .input-group{flex:0 0 150px}

/* ===== 趋势 ===== */
.trend-card{display:flex;align-items:center;gap:14px}
.trend-icon{font-size:30px}
.trend-text{flex:1}
.trend-text .t-title{font-size:14px;font-weight:700}
.trend-text .t-desc{font-size:12px;color:var(--txt2);margin-top:3px;line-height:1.6}

/* ===== 列表 ===== */
.record-list{display:flex;flex-direction:column;gap:7px;max-height:320px;overflow-y:auto}
.record-list::-webkit-scrollbar{width:5px}
.record-list::-webkit-scrollbar-thumb{background:rgba(120,140,145,.3);border-radius:3px}
.rec-item{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:rgba(246,250,249,.7);border:1px solid var(--border);border-radius:11px;transition:all .2s}
.rec-item:hover{border-color:rgba(47,179,163,.5)}
.rec-left{display:flex;flex-direction:column;gap:2px}
.rec-date{font-size:13px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.rec-note{font-size:11px;color:var(--txt3)}
.rec-right{display:flex;align-items:center;gap:10px}
.rec-weight{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.del-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:17px;padding:4px 8px;border-radius:8px;transition:all .2s;opacity:.55}
.del-btn:hover{opacity:1;background:rgba(224,101,80,.12)}
.list-empty{text-align:center;color:var(--txt3);padding:20px;font-size:13px}

/* ===== toast ===== */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(8px);background:rgba(38,52,60,.92);color:#fff;padding:10px 22px;border-radius:999px;font-size:13px;letter-spacing:1px;opacity:0;transition:opacity .35s ease,transform .35s ease;z-index:100;pointer-events:none;box-shadow:0 8px 24px rgba(30,60,55,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:420px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .goal-row .input-group{flex:1}
}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="title">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 17l5.5-5.5 4 4L21 7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7h6v6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <h1>体重曲线</h1>
        <p>记录每日体重，看见趋势变化</p>
      </div>
    </div>
  </header>

  <div class="intro">坚持记录体重并观察曲线，比纠结某一天的数字更有意义。<b>添加每日体重</b>后自动生成趋势图与统计，可设置目标体重查看差距，数据全部保存在本地浏览器。</div>

  <div class="card">
    <div class="sec-title">添加记录</div>
    <div class="add-form">
      <div class="form-row">
        <div class="input-group"><label>日期</label><input type="date" id="inDate"></div>
        <div class="input-group"><label>体重（kg）</label><input type="number" id="inWeight" step="0.1" min="20" max="300" placeholder="65.5"></div>
      </div>
      <div class="form-row">
        <div class="input-group" style="flex:2"><label>备注（可选）</label><input type="text" id="inNote" placeholder="如：晨起空腹"></div>
        <button class="btn btn-add" id="addBtn" style="align-self:flex-end">添加记录</button>
      </div>
    </div>
  </div>

  <div class="card chart-card">
    <div class="sec-title">体重趋势图 <span class="hint" id="chartHint"></span></div>
    <div id="chartContainer" style="position:relative">
      <canvas id="chartCanvas"></canvas>
      <div class="tooltip" id="tooltip"></div>
      <div class="empty-chart" id="emptyChart">暂无记录，点击上方添加第一条</div>
    </div>
  </div>

  <div class="card">
    <div class="sec-title">统计概览</div>
    <div class="goal-row">
      <div class="input-group"><label>目标体重（kg）</label><input type="number" id="goalInput" step="0.1" min="20" max="300" placeholder="如 60"></div>
      <button class="btn btn-ghost" id="goalBtn">设置目标</button>
    </div>
    <div class="stats-grid" id="statsGrid">
      <div class="stat neutral"><div class="v" id="sCurrent">-</div><div class="k">当前体重</div></div>
      <div class="stat neutral"><div class="v" id="sChange">-</div><div class="k">最新变化</div></div>
      <div class="stat neutral"><div class="v" id="sTotal">-</div><div class="k">总变化</div></div>
      <div class="stat neutral"><div class="v" id="sAvg">-</div><div class="k">平均体重</div></div>
      <div class="stat neutral"><div class="v" id="sMax">-</div><div class="k">最高体重</div></div>
      <div class="stat neutral"><div class="v" id="sMin">-</div><div class="k">最低体重</div></div>
    </div>
  </div>

  <div class="card">
    <div class="sec-title">趋势分析</div>
    <div class="trend-card">
      <div class="trend-icon" id="trendIcon">📊</div>
      <div class="trend-text">
        <div class="t-title" id="trendTitle">暂无数据</div>
        <div class="t-desc" id="trendDesc">添加记录后将显示趋势分析</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="sec-title">记录列表</div>
    <div class="record-list" id="recordList"></div>
  </div>

  <div style="text-align:center;font-size:11px;line-height:1.8;color:var(--txt3);padding:12px 4px 2px;letter-spacing:.3px">免责声明：体重数据仅用于个人记录与趋势观察，不构成健康诊断或减重/增重方案建议；如需制定体重管理计划，请咨询专业医生或营养师。</div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var records=[],goal=null,chartPoints=[],hoverIdx=-1;
  function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function showToast(msg){var t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},2000);}
  function load(){
    try{records=JSON.parse(localStorage.getItem("weight_records")||"[]");}catch(e){records=[];}
    goal=parseFloat(localStorage.getItem("weight_goal"))||null;
    if(goal)$("goalInput").value=goal;
  }
  function save(){localStorage.setItem("weight_records",JSON.stringify(records));}
  function sortRecords(){records.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});}
  function addRecord(){
    var date=$("inDate").value,weight=parseFloat($("inWeight").value),note=$("inNote").value.trim();
    if(!date){showToast("请选择日期");return;}
    if(!weight||weight<20||weight>300){showToast("请输入有效体重（20-300kg）");return;}
    var existing=records.findIndex(function(r){return r.date===date;});
    if(existing>=0){records[existing].weight=weight;records[existing].note=note;showToast("已更新该日期记录");}
    else{records.push({date:date,weight:weight,note:note});showToast("添加成功");}
    sortRecords();save();render();
    $("inWeight").value="";$("inNote").value="";
  }
  function deleteRecord(idx){records.splice(idx,1);save();render();showToast("已删除");}
  function setGoal(){
    var g=parseFloat($("goalInput").value);
    if(!g||g<20||g>300){showToast("请输入有效目标体重");return;}
    goal=g;localStorage.setItem("weight_goal",String(goal));render();showToast("目标已设置");
  }
  function fmtDate(s){return s.substring(5).replace("-","/");}
  function renderStats(){
    if(records.length===0){
      ["sCurrent","sChange","sTotal","sAvg","sMax","sMin"].forEach(function(id){$(id).textContent="-";});
      return;
    }
    var weights=records.map(function(r){return r.weight;});
    var current=weights[weights.length-1];
    var avg=weights.reduce(function(a,b){return a+b;},0)/weights.length;
    var maxW=Math.max.apply(null,weights),minW=Math.min.apply(null,weights);
    $("sCurrent").textContent=current.toFixed(1);
    if(weights.length>=2){
      var ch=current-weights[weights.length-2];
      var el=$("sChange");el.textContent=(ch>=0?"+":"")+ch.toFixed(1);
      el.parentElement.className="stat "+(ch>0.1?"up":ch<-0.1?"down":"neutral");
    }else $("sChange").textContent="-";
    if(weights.length>=2){
      var tot=current-weights[0];
      var el2=$("sTotal");el2.textContent=(tot>=0?"+":"")+tot.toFixed(1);
      el2.parentElement.className="stat "+(tot>0.1?"up":tot<-0.1?"down":"neutral");
    }else $("sTotal").textContent="-";
    $("sAvg").textContent=avg.toFixed(1);
    $("sMax").textContent=maxW.toFixed(1);
    $("sMin").textContent=minW.toFixed(1);
  }
  function renderTrend(){
    if(records.length<2){$("trendIcon").textContent="📊";$("trendTitle").textContent="暂无足够数据";$("trendTitle").style.color="";$("trendDesc").textContent="至少需要 2 条记录才能分析趋势";return;}
    var recent=records.slice(-7);
    var diff=recent[recent.length-1].weight-recent[0].weight;
    var days=Math.max(1,recent.length-1);
    var perDay=diff/days;
    var icon=$("trendIcon"),title=$("trendTitle"),desc=$("trendDesc");
    if(perDay>0.05){
      icon.textContent="📈";title.textContent="体重上升";title.style.color="var(--red)";
      desc.textContent="最近 "+recent.length+" 次记录上升 "+diff.toFixed(1)+"kg，日均 +"+perDay.toFixed(2)+"kg。建议关注饮食与运动平衡。";
    }else if(perDay<-0.05){
      icon.textContent="📉";title.textContent="体重下降";title.style.color="var(--green)";
      desc.textContent="最近 "+recent.length+" 次记录下降 "+Math.abs(diff).toFixed(1)+"kg，日均 "+perDay.toFixed(2)+"kg。保持良好节奏！";
    }else{
      icon.textContent="➡️";title.textContent="体重稳定";title.style.color="var(--accent)";
      desc.textContent="最近 "+recent.length+" 次记录波动 "+Math.abs(diff).toFixed(1)+"kg，体重保持稳定。";
    }
    if(goal){
      var cur=records[records.length-1].weight,gap=cur-goal;
      if(Math.abs(gap)<0.5)desc.textContent+=" 已接近目标体重，继续保持！";
      else if(gap>0)desc.textContent+=" 距目标还差 "+gap.toFixed(1)+"kg，加油！";
      else desc.textContent+=" 已低于目标 "+Math.abs(gap).toFixed(1)+"kg，注意保持健康范围。";
    }
  }
  function renderChart(){
    var canvas=$("chartCanvas"),ctx=canvas.getContext("2d");
    var container=$("chartContainer");
    var dpr=window.devicePixelRatio||1;
    var w=container.offsetWidth,h=280;
    canvas.width=w*dpr;canvas.height=h*dpr;
    canvas.style.width=w+"px";canvas.style.height=h+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    if(records.length===0){$("emptyChart").style.display="block";canvas.style.display="none";$("chartHint").textContent="";return;}
    $("emptyChart").style.display="none";canvas.style.display="block";
    var padL=44,padR=16,padT=16,padB=30;
    var cw=w-padL-padR,ch=h-padT-padB;
    var weights=records.map(function(r){return r.weight;});
    var minV=Math.min.apply(null,weights),maxV=Math.max.apply(null,weights);
    if(goal!==null){minV=Math.min(minV,goal);maxV=Math.max(maxV,goal);}
    var range=maxV-minV;if(range<2)range=2;
    minV-=range*0.1;maxV+=range*0.1;range=maxV-minV;
    var n=records.length;
    var xAt=function(i){return padL+(n===1?cw/2:cw*i/(n-1));};
    var yAt=function(v){return padT+ch-(v-minV)/range*ch;};
    var ySteps=5;
    for(var i=0;i<=ySteps;i++){
      var v=minV+range*i/ySteps,y=yAt(v);
      ctx.strokeStyle="rgba(120,140,150,.18)";ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-padR,y);ctx.stroke();
      ctx.fillStyle="#94a5ae";ctx.font="11px sans-serif";ctx.textAlign="right";
      ctx.fillText(v.toFixed(1),padL-6,y+3);
    }
    var xLabelCount=Math.min(n,7);
    for(var j=0;j<xLabelCount;j++){
      var idx=Math.floor(j*(n-1)/Math.max(1,xLabelCount-1)),x=xAt(idx);
      ctx.fillStyle="#94a5ae";ctx.textAlign="center";
      ctx.fillText(fmtDate(records[idx].date),x,h-padB+16);
    }
    ctx.strokeStyle="rgba(120,140,150,.35)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,padT+ch);ctx.lineTo(w-padR,padT+ch);ctx.stroke();
    if(goal!==null){
      var gy=yAt(goal);
      ctx.strokeStyle="rgba(224,154,80,.75)";ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
      ctx.beginPath();ctx.moveTo(padL,gy);ctx.lineTo(w-padR,gy);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle="rgba(200,130,60,.95)";ctx.textAlign="left";ctx.font="11px sans-serif";
      ctx.fillText("目标 "+goal.toFixed(1),w-padR-62,gy-5);
    }
    chartPoints=[];
    if(n>=2){
      var grad=ctx.createLinearGradient(padL,0,w-padR,0);
      grad.addColorStop(0,"#2fb3a3");grad.addColorStop(1,"#3f8fc9");
      ctx.strokeStyle=grad;ctx.lineWidth=2.6;ctx.lineJoin="round";
      ctx.beginPath();
      for(var k=0;k<n;k++){
        var xk=xAt(k),yk=yAt(records[k].weight);
        chartPoints.push({x:xk,y:yk,idx:k});
        if(k===0)ctx.moveTo(xk,yk);else ctx.lineTo(xk,yk);
      }
      ctx.stroke();
    }
    for(var p=0;p<n;p++){
      var xp=xAt(p),yp=yAt(records[p].weight);
      if(hoverIdx===p){
        ctx.fillStyle="rgba(47,179,163,.18)";
        ctx.beginPath();ctx.arc(xp,yp,12,0,Math.PI*2);ctx.fill();
      }
      ctx.fillStyle="#ffffff";ctx.beginPath();ctx.arc(xp,yp,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=hoverIdx===p?"#e0a020":"#2fb3a3";
      ctx.beginPath();ctx.arc(xp,yp,3.5,0,Math.PI*2);ctx.fill();
    }
    $("chartHint").textContent=records.length+" 条记录";
  }
  function renderList(){
    var el=$("recordList");
    if(records.length===0){el.innerHTML='<div class="list-empty">暂无记录</div>';return;}
    el.innerHTML=records.slice().reverse().map(function(r,i){
      var realIdx=records.length-1-i;
      return '<div class="rec-item"><div class="rec-left"><div class="rec-date">'+r.date+'</div>'+(r.note?'<div class="rec-note">'+r.note+'</div>':'')+'</div><div class="rec-right"><div class="rec-weight">'+r.weight.toFixed(1)+'kg</div><button class="del-btn" data-idx="'+realIdx+'">✕</button></div></div>';
    }).join("");
  }
  function render(){renderStats();renderTrend();renderChart();renderList();}
  function findNearestPoint(mx,my){
    var best=-1,bestDist=1e9;
    for(var i=0;i<chartPoints.length;i++){
      var dx=mx-chartPoints[i].x,dy=my-chartPoints[i].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<bestDist){bestDist=d;best=i;}
    }
    return bestDist<25?best:-1;
  }
  var canvas=$("chartCanvas"),tooltip=$("tooltip");
  function handleMove(e){
    if(records.length===0)return;
    var rect=canvas.getBoundingClientRect();
    var cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
    var cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
    var idx=findNearestPoint(cx,cy);
    if(idx>=0&&idx<records.length){
      hoverIdx=idx;renderChart();
      var r=records[idx];
      tooltip.style.display="block";
      tooltip.innerHTML='<div class="tt-date">'+r.date+'</div><div class="tt-weight">'+r.weight.toFixed(1)+' kg</div>'+(r.note?'<div class="tt-note">'+r.note+'</div>':'');
      tooltip.style.left=Math.min(cx+12,rect.width-120)+"px";
      tooltip.style.top=Math.max(cy-50,0)+"px";
    }else{
      if(hoverIdx!==-1){hoverIdx=-1;renderChart();}
      tooltip.style.display="none";
    }
  }
  function handleLeave(){hoverIdx=-1;tooltip.style.display="none";renderChart();}
  canvas.addEventListener("mousemove",handleMove);
  canvas.addEventListener("mouseleave",handleLeave);
  canvas.addEventListener("touchstart",function(e){handleMove(e);},{passive:true});
  canvas.addEventListener("touchmove",function(e){handleMove(e);},{passive:true});
  canvas.addEventListener("touchend",handleLeave);
  $("addBtn").addEventListener("click",addRecord);
  $("goalBtn").addEventListener("click",setGoal);
  $("recordList").addEventListener("click",function(e){
    if(e.target.classList.contains("del-btn"))deleteRecord(parseInt(e.target.dataset.idx));
  });
  $("inWeight").addEventListener("keydown",function(e){if(e.key==="Enter")addRecord();});
  $("inNote").addEventListener("keydown",function(e){if(e.key==="Enter")addRecord();});
  window.addEventListener("resize",function(){renderChart();});
  $("inDate").value=todayStr();
  load();render();
})();
</script>
</body>
</html>
