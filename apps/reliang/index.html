<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>热量一眼过</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
:root{
  --orange:#f97316;--amber:#fb923c;--ink:#1c1917;--muted:#78716c;--bg:#1a120c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Noto Sans SC",system-ui,sans-serif;color:#fff;
  background:var(--bg);display:flex;justify-content:center;
}
#app{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;padding-bottom:24px}
.viewfinder{
  position:relative;margin:16px 16px 0;aspect-ratio:3/4;border-radius:28px;overflow:hidden;
  background:
    radial-gradient(circle at 30% 30%,rgba(251,146,60,.25),transparent 40%),
    linear-gradient(160deg,#3f2a1e,#1c1410 55%,#2a1a12);
  box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.08);
}
.vf-grid{
  position:absolute;inset:18px;border:1px solid rgba(255,255,255,.18);border-radius:18px;
  background:
    linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px) 0 0/100% 33.33%,
    linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px) 0 0/33.33% 100%;
  pointer-events:none;
}
.corner{position:absolute;width:28px;height:28px;border:3px solid var(--orange)}
.corner.tl{left:22px;top:22px;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
.corner.tr{right:22px;top:22px;border-left:none;border-bottom:none;border-radius:0 6px 0 0}
.corner.bl{left:22px;bottom:22px;border-right:none;border-top:none;border-radius:0 0 0 6px}
.corner.br{right:22px;bottom:22px;border-left:none;border-top:none;border-radius:0 0 6px 0}
.hud-top{
  position:absolute;left:0;right:0;top:14px;display:flex;justify-content:space-between;padding:0 28px;
  font-size:11px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.7);z-index:2;
}
.dish-stage{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:1;padding:40px 24px;text-align:center;
}
.plate{
  width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff7ed,#fdba74 45%,#c2410c);
  box-shadow:0 16px 40px rgba(0,0,0,.35),inset 0 0 30px rgba(255,255,255,.25);
  display:grid;place-items:center;font-size:64px;margin-bottom:18px;
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}
.plate.snap{animation:shutter .45s ease}
@keyframes shutter{0%{transform:scale(1)}40%{transform:scale(.92)}100%{transform:scale(1)}}
.dish-name{font-size:22px;font-weight:900;margin-bottom:4px}
.dish-sub{font-size:12px;color:rgba(255,255,255,.65)}
.gauge-wrap{
  position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;z-index:2;
}
.gauge{width:150px;height:150px;position:relative}
.gauge svg{transform:rotate(-90deg)}
.gauge .read{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.gauge .read b{font-family:"Bebas Neue",sans-serif;font-size:42px;line-height:1;color:#fff}
.gauge .read span{font-size:11px;color:rgba(255,255,255,.7);letter-spacing:.1em}
.shutter-bar{
  display:flex;align-items:center;justify-content:center;gap:28px;padding:18px 16px 8px;
}
.icon-btn{
  width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);color:#fff;font-size:16px;cursor:pointer;
}
.shutter{
  width:72px;height:72px;border-radius:50%;border:4px solid rgba(255,255,255,.85);
  background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;
}
.shutter i{display:block;width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,var(--amber),var(--orange));box-shadow:0 0 24px rgba(249,115,22,.45)}
.shutter:active i{transform:scale(.92)}
.tray{
  padding:8px 16px 0;display:flex;gap:8px;overflow:auto;
}
.chip{
  flex:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);
  color:#fff;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
}
.chip.on{background:rgba(249,115,22,.2);border-color:rgba(249,115,22,.6);color:#fdba74}
.macros{
  margin:14px 16px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
}
.macro{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 8px;text-align:center;
}
.macro b{display:block;font-family:"Bebas Neue",sans-serif;font-size:24px}
.macro span{font-size:11px;color:rgba(255,255,255,.55)}
.history{
  margin:14px 16px 0;background:rgba(255,255,255,.04);border-radius:16px;padding:12px 14px;
  border:1px solid rgba(255,255,255,.06);
}
.history h3{font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.08em;margin-bottom:8px;font-weight:700}
.hist-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.hist-row:last-child{border-bottom:none}
.hist-row b{font-weight:700}
.toast{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);
  background:rgba(255,247,237,.95);color:#1c1917;padding:10px 14px;border-radius:12px;font-size:13px;font-weight:700;
  opacity:0;pointer-events:none;transition:.25s;z-index:40;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.title-bar{padding:18px 18px 0;display:flex;justify-content:space-between;align-items:flex-end}
.title-bar h1{font-size:22px;font-weight:900}
.title-bar p{font-size:11px;color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<div id="app">
  <div class="title-bar">
    <div>
      <h1>热量一眼过</h1>
      <p>食堂取景框 · 点选菜品估热量</p>
    </div>
    <div style="font-size:11px;font-weight:800;color:#fb923c" id="today">今日 0 kcal</div>
  </div>
  <div class="viewfinder">
    <div class="hud-top"><span>ISO 食堂</span><span id="clock">12:00</span><span>AF·AUTO</span></div>
    <div class="vf-grid"></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="dish-stage">
      <div class="plate" id="plate">🍜</div>
      <div class="dish-name" id="dname">红烧排骨饭</div>
      <div class="dish-sub" id="dsub">点击快门识别热量</div>
    </div>
    <div class="gauge-wrap">
      <div class="gauge">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="62" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="12"/>
          <circle id="kcal-arc" cx="75" cy="75" r="62" fill="none" stroke="#f97316" stroke-width="12"
            stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="389.6"/>
        </svg>
        <div class="read"><b id="kcal">—</b><span>KCAL</span></div>
      </div>
    </div>
  </div>
  <div class="shutter-bar">
    <button class="icon-btn" id="prev">‹</button>
    <button class="shutter" id="shutter" aria-label="快门"><i></i></button>
    <button class="icon-btn" id="next">›</button>
  </div>
  <div class="tray" id="tray"></div>
  <div class="macros">
    <div class="macro"><b id="carb">—</b><span>碳水 g</span></div>
    <div class="macro"><b id="pro">—</b><span>蛋白 g</span></div>
    <div class="macro"><b id="fat">—</b><span>脂肪 g</span></div>
  </div>
  <div class="history">
    <h3>今日拍摄记录</h3>
    <div id="hist"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const DISHES=[
  {name:"红烧排骨饭",emoji:"🍖",kcal:680,carb:78,pro:28,fat:26,tip:"排骨偏油，建议搭配青菜"},
  {name:"番茄鸡蛋面",emoji:"🍜",kcal:420,carb:62,pro:16,fat:12,tip:"相对清淡，适合作午餐"},
  {name:"香菇青菜",emoji:"🥦",kcal:90,carb:10,pro:4,fat:4,tip:"低热量加餐首选"},
  {name:"宫保鸡丁",emoji:"🍗",kcal:520,carb:28,pro:32,fat:30,tip:"花生提脂，控制份量"},
  {name:"紫薯山药粥",emoji:"🥣",kcal:210,carb:42,pro:5,fat:2,tip:"适合减脂期晚餐"},
  {name:"卤肉饭套餐",emoji:"🍚",kcal:750,carb:85,pro:24,fat:32,tip:"热量偏高，下午可少吃主食"}
];
const KEY="rl-shots-v1";
let idx=0, revealed=false;
let shots=JSON.parse(localStorage.getItem(KEY)||"[]");
const day=new Date().toDateString();
shots=shots.filter(s=>s.day===day);

function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>el.classList.remove("show"),1600)}
function setClock(){
  const d=new Date();
  document.getElementById("clock").textContent=d.toTimeString().slice(0,5);
}
function setArc(kcal){
  const max=900,C=2*Math.PI*62;
  const p=Math.min(1,kcal/max);
  document.getElementById("kcal-arc").style.strokeDashoffset=C*(1-p);
  const color=kcal<300?"#4ade80":kcal<550?"#f97316":"#ef4444";
  document.getElementById("kcal-arc").setAttribute("stroke",color);
}
function showDish(scan){
  const d=DISHES[idx];
  document.getElementById("plate").textContent=d.emoji;
  document.getElementById("dname").textContent=d.name;
  document.getElementById("dsub").textContent=scan?d.tip:"对准菜品，按下快门";
  if(scan){
    document.getElementById("kcal").textContent=d.kcal;
    document.getElementById("carb").textContent=d.carb;
    document.getElementById("pro").textContent=d.pro;
    document.getElementById("fat").textContent=d.fat;
    setArc(d.kcal);
  }else{
    document.getElementById("kcal").textContent="—";
    document.getElementById("carb").textContent="—";
    document.getElementById("pro").textContent="—";
    document.getElementById("fat").textContent="—";
    setArc(0);
  }
  document.querySelectorAll(".chip").forEach((c,i)=>c.classList.toggle("on",i===idx));
}
function renderTray(){
  document.getElementById("tray").innerHTML=DISHES.map((d,i)=>
    `<button class="chip${i===idx?" on":""}" data-i="${i}">${d.emoji} ${d.name}</button>`).join("");
}
function renderHist(){
  const total=shots.reduce((s,x)=>s+x.kcal,0);
  document.getElementById("today").textContent="今日 "+total+" kcal";
  const box=document.getElementById("hist");
  if(!shots.length){box.innerHTML='<div class="hist-row"><span>还没有拍摄记录</span></div>';return}
  box.innerHTML=shots.slice(0,6).map(s=>`<div class="hist-row"><span>${s.name}</span><b>${s.kcal} kcal</b></div>`).join("");
}
function select(i,reset=true){
  idx=i;revealed=false;showDish(false);if(reset)renderTray();
}
document.getElementById("tray").onclick=e=>{
  const b=e.target.closest("[data-i]");if(!b)return;select(+b.dataset.i);
};
document.getElementById("prev").onclick=()=>select((idx-1+DISHES.length)%DISHES.length);
document.getElementById("next").onclick=()=>select((idx+1)%DISHES.length);
document.getElementById("shutter").onclick=()=>{
  const d=DISHES[idx];
  const plate=document.getElementById("plate");
  plate.classList.remove("snap");void plate.offsetWidth;plate.classList.add("snap");
  revealed=true;showDish(true);
  shots.unshift({name:d.name,kcal:d.kcal,day,at:Date.now()});
  localStorage.setItem(KEY,JSON.stringify(shots.slice(0,30)));
  renderHist();toast("识别完成 · "+d.kcal+" kcal");
};
renderTray();showDish(false);renderHist();setClock();setInterval(setClock,30000);
</script>
</body>
</html>
