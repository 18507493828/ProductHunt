<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骑行城市线</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
:root{
  --cyan:#22d3ee;--teal:#06b6d4;--bg:#041016;--panel:#0b1c24;--ink:#e6fbff;--muted:#7aa8b5;--line:rgba(34,211,238,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Noto Sans SC",system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(700px 360px at 80% 0%,rgba(34,211,238,.18),transparent 55%),
    radial-gradient(600px 300px at 0% 100%,rgba(6,182,212,.12),transparent 50%),
    var(--bg);
}
.app{max-width:1200px;margin:0 auto;padding:18px 20px 36px;min-height:100%;display:grid;grid-template-rows:auto auto 1fr;gap:14px}
.hud{
  display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:12px;
}
@media(max-width:900px){.hud{grid-template-columns:1fr 1fr}}
.gauge-card{
  background:linear-gradient(160deg,#0e2430,#07151c);border:1px solid var(--line);border-radius:18px;
  padding:16px 18px;box-shadow:inset 0 0 40px rgba(34,211,238,.05);
}
.gauge-card .label{font-size:11px;letter-spacing:.16em;color:var(--muted);font-family:"Share Tech Mono",monospace}
.gauge-card .val{
  font-family:"Share Tech Mono",monospace;font-size:48px;line-height:1.1;color:var(--cyan);margin-top:6px;
  text-shadow:0 0 18px rgba(34,211,238,.35);
}
.gauge-card .val small{font-size:16px;color:var(--muted);margin-left:4px}
.gauge-card.main{grid-row:span 1}
.main-title{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:4px}
.main-title h1{font-size:22px;font-weight:900}
.main-title span{font-family:"Share Tech Mono",monospace;font-size:12px;color:var(--cyan)}
.body{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
@media(max-width:900px){.body{grid-template-columns:1fr}}
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;
}
.panel-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.panel-h h2{font-size:14px;font-weight:900}
.panel-h span{font-size:11px;color:var(--muted);font-family:"Share Tech Mono",monospace}
.filter-chips{
  display:flex;gap:8px;padding:10px 12px 0;
}
.filter-chips button{
  border:1px solid rgba(34,211,238,.28);background:transparent;color:var(--muted);
  border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;
}
.filter-chips button.on{background:rgba(34,211,238,.15);color:var(--cyan);border-color:rgba(34,211,238,.55)}
.routes{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px;max-height:520px}
.route{
  text-align:left;border:1px solid transparent;background:rgba(34,211,238,.04);border-radius:14px;
  padding:12px 14px;cursor:pointer;color:inherit;font:inherit;
}
.route.on{border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.1)}
.route.saved-hi{border-color:rgba(34,211,238,.7);background:rgba(34,211,238,.16)}
.route.flash{animation:favFlash .9s ease}
@keyframes favFlash{0%,100%{box-shadow:none}40%{box-shadow:0 0 0 2px rgba(34,211,238,.55)}}
.route .star{color:var(--cyan);margin-left:4px}
.route b{display:block;font-size:15px;font-weight:900;margin-bottom:4px}
.route .m{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.route .m em{font-style:normal;color:var(--cyan);font-family:"Share Tech Mono",monospace}
.routes-empty{
  padding:36px 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6;
}
.routes-empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}
.mapbox{position:relative;min-height:260px;height:280px;background:#06141b;border-radius:0}
.mapbox #map{width:100%;height:100%;min-height:220px}
.leaflet-container{font:inherit;background:#06141b}
.stations{padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:220px}
.station{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  background:rgba(255,255,255,.03);border-radius:12px;padding:10px 12px;border:1px solid rgba(34,211,238,.08);
}
.station.next{border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.08)}
.station .dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.station b{display:block;font-size:13px}.station span{font-size:11px;color:var(--muted)}
.station .km{font-family:"Share Tech Mono",monospace;color:var(--cyan);font-size:13px}
.action-bar{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.btn{
  flex:1;border:none;border-radius:12px;padding:12px;font:inherit;font-weight:800;cursor:pointer;
  background:linear-gradient(135deg,var(--cyan),var(--teal));color:#042028;
}
.btn.ghost{background:transparent;color:var(--cyan);border:1px solid rgba(34,211,238,.35)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toast{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);
  background:rgba(230,251,255,.95);color:#042028;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;
  opacity:0;pointer-events:none;transition:.25s;z-index:2000;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.blink{animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.trip-card{
  display:none;position:relative;z-index:5;
  background:linear-gradient(120deg,#0a2a36,#083040);
  border:1px solid rgba(34,211,238,.4);border-radius:16px;padding:14px 16px;
  box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 0 30px rgba(34,211,238,.06);
  scroll-margin-top:8px;
}
.trip-card.open{display:block}
.trip-card .nav-top{
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px;
}
.trip-card .nav-live{
  font-family:"Share Tech Mono",monospace;font-size:11px;letter-spacing:.14em;color:var(--cyan);
}
.trip-card h3{font-size:16px;font-weight:900;margin-top:2px}
.trip-card .nav-end{
  border:1px solid rgba(34,211,238,.4);background:rgba(34,211,238,.08);color:var(--cyan);
  border-radius:10px;padding:8px 14px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;
}
.nav-meta{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;
}
@media(max-width:700px){.nav-meta{grid-template-columns:1fr 1fr}}
.nav-meta .cell{
  background:rgba(0,0,0,.22);border-radius:12px;padding:10px 12px;border:1px solid rgba(34,211,238,.1);
}
.nav-meta .cell .k{font-size:10px;letter-spacing:.12em;color:var(--muted);font-family:"Share Tech Mono",monospace}
.nav-meta .cell .v{font-size:14px;font-weight:800;margin-top:4px}
.trip-stops-h{
  font-size:11px;letter-spacing:.12em;color:var(--muted);font-family:"Share Tech Mono",monospace;
  margin-bottom:8px;
}
.trip-stops{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.trip-stop{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:rgba(0,0,0,.18);border-radius:10px;padding:8px 12px;border:1px solid rgba(34,211,238,.08);
  font-size:13px;
}
.trip-stop.next{border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.1)}
.trip-stop span{color:var(--muted);font-family:"Share Tech Mono",monospace;font-size:12px}
.nav-progress{
  height:8px;border-radius:999px;background:rgba(34,211,238,.12);overflow:hidden;
}
.nav-progress i{
  display:block;height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,var(--cyan),var(--teal));
  box-shadow:0 0 12px rgba(34,211,238,.5);transition:width .35s linear;
}
.panel.fav-focus{box-shadow:0 0 0 2px rgba(34,211,238,.35)}
.trip-log{
  margin-top:14px;border:1px solid rgba(34,211,238,.18);border-radius:14px;padding:12px 14px;
  background:rgba(4,16,22,.55);
}
.trip-log h4{font-size:12px;font-weight:800;color:var(--cyan);letter-spacing:.06em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.trip-log h4 button{
  border:1px solid rgba(34,211,238,.3);background:transparent;color:var(--muted);
  border-radius:8px;padding:4px 8px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;
}
.trip-log-row{
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:12px;padding:6px 0;
  border-bottom:1px solid rgba(34,211,238,.08);color:var(--ink);
}
.trip-log-row > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.trip-log-row:last-child{border-bottom:none}
.trip-log-row span{color:var(--muted);font-family:"Share Tech Mono",monospace;font-size:11px}
.trip-log-empty{font-size:12px;color:var(--muted);padding:4px 0}
</style>
</head>
<body>
<div class="app">
  <div class="main-title">
    <h1>骑行城市线</h1>
    <span class="blink" id="rec">● REC HUD</span>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;flex-wrap:wrap">
    <span id="place-label" style="font-size:12px;color:var(--muted)">定位中…</span>
    <button type="button" class="btn ghost" id="relocate-btn" style="width:auto;margin:0;padding:6px 12px;font-size:12px">重新定位</button>
  </div>
  <div class="trip-card" id="trip-card">
    <div class="nav-top">
      <div>
        <div class="nav-live blink">● 当前行程</div>
        <h3 id="nav-name">—</h3>
      </div>
      <button type="button" class="nav-end" id="nav-end">结束导航</button>
    </div>
    <div class="nav-meta">
      <div class="cell"><div class="k">里程</div><div class="v" id="nav-km">—</div></div>
      <div class="cell"><div class="k">预计 ETA</div><div class="v" id="nav-eta">—</div></div>
      <div class="cell"><div class="k">进度</div><div class="v" id="nav-pct">0%</div></div>
      <div class="cell"><div class="k">已骑行</div><div class="v" id="nav-elapsed">00:00</div></div>
    </div>
    <div class="trip-stops-h">补给站清单</div>
    <div class="trip-stops" id="trip-stops"></div>
    <div class="nav-progress"><i id="nav-bar"></i></div>
  </div>
  <section class="hud">
    <div class="gauge-card main">
      <div class="label">CURRENT SPEED</div>
      <div class="val" id="spd">24.6<small>km/h</small></div>
    </div>
    <div class="gauge-card">
      <div class="label">DISTANCE</div>
      <div class="val" id="dist" style="font-size:32px">18.4<small>km</small></div>
    </div>
    <div class="gauge-card">
      <div class="label">RIDE TIME</div>
      <div class="val" id="time" style="font-size:32px">48<small>min</small></div>
    </div>
    <div class="gauge-card">
      <div class="label">AVG CADENCE</div>
      <div class="val" id="cad" style="font-size:32px">86<small>rpm</small></div>
    </div>
  </section>
  <div class="body">
    <section class="panel" id="list-panel">
      <div class="panel-h"><h2>城市路线库</h2><span id="count">0 ROUTES</span></div>
      <div class="filter-chips" id="chips">
        <button type="button" class="on" data-chip="all">全部</button>
        <button type="button" data-chip="saved">已收藏 <span id="chip-saved-n">0</span></button>
      </div>
      <div class="routes" id="routes"></div>
      <div class="action-bar" style="flex-wrap:wrap">
        <button class="btn" id="start">开始导航</button>
        <button class="btn ghost" id="save">收藏路线</button>
        <button class="btn ghost" id="open-start" type="button" style="flex:1 1 100%">地图导航到起点</button>
      </div>
      <div class="trip-log" id="trip-log">
        <h4>行程记录 <button type="button" id="trip-clear">清空</button></h4>
        <div id="trip-log-body"></div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-h"><h2 id="rname">河岸绿道环线</h2><span id="rtag">CITY LOOP</span></div>
      <div class="mapbox">
        <div id="map" style="height:100%;min-height:220px"></div>
      </div>
      <div class="panel-h" style="border-top:1px solid var(--line);border-bottom:none"><h2>补给站</h2><span>SUPPLY</span></div>
      <div class="stations" id="stations"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const ROUTES=[
  {id:1,name:"河岸绿道环线",tag:"CITY LOOP",km:18.4,mins:48,spd:24.6,cad:86,dNorth:420,dEast:-280,
    stations:[{name:"东桥补给点",desc:"饮水 · 打气筒",at:"4.2km"},{name:"湿地驿站",desc:"能量胶 · 卫生间",at:"9.8km"},{name:"南岸咖啡",desc:"休息 · 简易维修",at:"14.5km"}]},
  {id:2,name:"大学城通勤快线",tag:"COMMUTE",km:12.0,mins:32,spd:27.1,cad:92,dNorth:-360,dEast:640,
    stations:[{name:"南门便利店",desc:"补给饮料",at:"3.0km"},{name:"体育馆气站",desc:"打气 · 补胎",at:"7.5km"}]},
  {id:3,name:"古城骑行观光线",tag:"SIGHTSEE",km:22.5,mins:70,spd:21.0,cad:78,dNorth:880,dEast:220,
    stations:[{name:"北门茶馆",desc:"歇脚 · 加水",at:"5.5km"},{name:"钟楼补给",desc:"能量棒",at:"11.0km"},{name:"护城河驿",desc:"维修工具箱",at:"17.2km"}]},
  {id:4,name:"滨海风道冲刺",tag:"SPRINT",km:15.8,mins:38,spd:29.4,cad:98,dNorth:-180,dEast:-520,
    stations:[{name:"风车广场",desc:"饮水机",at:"6.0km"},{name:"灯塔补给",desc:"电解质 · 打气",at:"12.4km"}]},
  {id:5,name:"山地公园爬坡线",tag:"CLIMB",km:25.0,mins:95,spd:16.8,cad:70,dNorth:120,dEast:1100,
    stations:[{name:"山脚补给",desc:"重装补水",at:"2.0km"},{name:"半山观景台",desc:"休息 · 补给",at:"13.5km"},{name:"顶峰驿站",desc:"热饮 · 简修",at:"22.0km"}]}
];
const KEY="qx-saved-v1";
const TRIP_KEY="qx-trips-v1";
let saved=[];
let trips=[];
let active=ROUTES[0];
let listFilter="all";
let navTimer=null;
let navTick=0;
let navProgress=0;
let navigating=false;
let flashId=null;
let geoWatchId=null;
let gpsLive=false;
let lastGpsPos=null;
let distCoveredGps=0; // km from haversine accumulation
let gpsSpeedKmh=null;
let windLabel="";
let userOrigin=null;
let userPlaceLabel="";
let leafletMap=null;
let routePoly=null;
let mapMarkers=[];

function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>el.classList.remove("show"),1600)}
function setPlaceUI(){
  const el=document.getElementById("place-label");
  if(el) el.textContent=userPlaceLabel?("当前位置 · "+userPlaceLabel):"定位中…";
}
function setRecStatus(){
  const rec=document.getElementById("rec");
  if(!navigating){rec.textContent="● REC HUD"+(windLabel?" · "+windLabel:"");return}
  rec.textContent=gpsLive?"● GPS LIVE":"● NAV · 估算";
  if(windLabel) rec.textContent+=" · "+windLabel;
}
async function refreshLocation(showToast){
  const btn=document.getElementById("relocate-btn");
  if(btn) btn.disabled=true;
  if(!window.MashangChuangGeo){ if(btn) btn.disabled=false; return; }
  try{
    const loc=await MashangChuangGeo.locateWithPlace();
    const p=loc.pos||MashangChuangGeo.FALLBACK;
    userOrigin=p;
    userPlaceLabel=loc.ok?(loc.placeLabel||loc.placeShort||"当前位置"):MashangChuangGeo.FALLBACK.label;
    enrichRoutes(p);
    setPlaceUI();
    if(typeof render==="function") render();
    try{
      const wx=await MashangChuangGeo.fetchWeather(p.lat,p.lng);
      windLabel="风 "+wx.wind;
    }catch(e){}
    setRecStatus();
    if(showToast) toast(loc.ok?("已重新定位 · "+userPlaceLabel):("定位失败 · "+userPlaceLabel));
  } finally {
    if(btn) btn.disabled=false;
  }
}
function saveTrips(){MashangChuangAuth.writeJSON(TRIP_KEY,trips.slice(0,20))}
function saveSaved(){MashangChuangAuth.writeJSON(KEY,saved)}
function renderTripLog(){
  const box=document.getElementById("trip-log-body");
  if(!trips.length){box.innerHTML='<div class="trip-log-empty">完成一次导航后会出现在这里</div>';return}
  box.innerHTML=trips.map(t=>`
    <div class="trip-log-row">
      <div><b>${t.name}</b><span>${t.km}km · ${t.elapsed} · ${t.at}</span></div>
      <button type="button" data-del-trip="${t.id}" style="border:none;background:transparent;color:var(--muted);font:inherit;font-size:11px;cursor:pointer">删除</button>
    </div>
  `).join("");
  box.onclick=e=>{
    const b=e.target.closest("[data-del-trip]");
    if(!b) return;
    trips=trips.filter(x=>String(x.id)!==String(b.dataset.delTrip));
    saveTrips();renderTripLog();toast("已删除该行程");
  };
}
function fmtElapsed(sec){
  const m=String(Math.floor(sec/60)).padStart(2,"0");
  const s=String(sec%60).padStart(2,"0");
  return m+":"+s;
}
function etaText(r,progress){
  const left=Math.max(0,Math.round(r.mins*(1-progress/100)));
  if(progress>=100) return "已到达";
  return left+" min";
}
function setHud(r,override){
  const spd=override?.spd??r.spd;
  const dist=override?.dist??r.km;
  const mins=override?.mins??r.mins;
  const cad=override?.cad??r.cad;
  const cadEst=override?.cadEst!==false;
  document.getElementById("spd").innerHTML=(typeof spd==="number"?spd.toFixed(1):spd)+"<small>km/h</small>";
  document.getElementById("dist").innerHTML=(typeof dist==="number"?dist.toFixed(1):dist)+"<small>km</small>";
  document.getElementById("time").innerHTML=mins+"<small>min</small>";
  document.getElementById("cad").innerHTML=cad+"<small>rpm</small>";
  const cadLabel=document.getElementById("cad")?.closest(".gauge-card")?.querySelector(".label");
  if(cadLabel) cadLabel.textContent=cadEst?"AVG CADENCE · 估算":"AVG CADENCE";
}
function enrichRoutes(origin){
  const o=origin||(window.MashangChuangGeo&&MashangChuangGeo.FALLBACK)||{lat:30.2741,lng:120.1551};
  userOrigin=o;
  if(!window.MashangChuangGeo) return;
  ROUTES.forEach(r=>{
    const start=MashangChuangGeo.offsetLatLng(o.lat,o.lng,r.dNorth||0,r.dEast||0);
    r.startLat=start.lat;
    r.startLng=start.lng;
    r.latlngs=MashangChuangGeo.buildLoopRoute(start,r.km,r.id);
  });
}
function pointAlongPath(pts,frac){
  if(!pts||!pts.length) return null;
  if(pts.length===1||frac<=0) return pts[0];
  if(frac>=1) return pts[pts.length-1];
  const total=MashangChuangGeo.pathLength(pts);
  const target=total*frac;
  let acc=0;
  for(let i=1;i<pts.length;i++){
    const seg=MashangChuangGeo.haversine(pts[i-1],pts[i]);
    if(acc+seg>=target){
      const t=seg>0?(target-acc)/seg:0;
      return {
        lat:pts[i-1].lat+(pts[i].lat-pts[i-1].lat)*t,
        lng:pts[i-1].lng+(pts[i].lng-pts[i-1].lng)*t
      };
    }
    acc+=seg;
  }
  return pts[pts.length-1];
}
function clearMapLayers(){
  if(!leafletMap) return;
  if(routePoly){try{leafletMap.removeLayer(routePoly)}catch(e){} routePoly=null}
  mapMarkers.forEach(m=>{try{leafletMap.removeLayer(m)}catch(e){}});
  mapMarkers=[];
}
function drawMap(r){
  if(!window.MashangChuangGeo) return;
  if(!r.latlngs||!r.latlngs.length){
    const o=userOrigin||MashangChuangGeo.FALLBACK;
    const start=MashangChuangGeo.offsetLatLng(o.lat,o.lng,r.dNorth||0,r.dEast||0);
    r.startLat=start.lat;r.startLng=start.lng;
    r.latlngs=MashangChuangGeo.buildLoopRoute(start,r.km,r.id);
  }
  const center={lat:r.startLat,lng:r.startLng};
  MashangChuangGeo.createMap("map",center,13).then(({map,L})=>{
    leafletMap=map;
    clearMapLayers();
    const pts=r.latlngs;
    const latlngs=pts.map(p=>[p.lat,p.lng]);
    routePoly=L.polyline(latlngs,{color:"#22d3ee",weight:4,opacity:.92}).addTo(map);
    const startM=L.circleMarker([pts[0].lat,pts[0].lng],{
      radius:8,color:"#041016",weight:2,fillColor:"#06b6d4",fillOpacity:1
    }).addTo(map).bindPopup("起点 · "+r.name);
    mapMarkers.push(startM);
    (r.stations||[]).forEach((s,i)=>{
      const kmMatch=String(s.at||"").match(/([\d.]+)/);
      const atKm=kmMatch?parseFloat(kmMatch[1]):((i+1)/(r.stations.length+1))*r.km;
      const frac=Math.min(0.98,Math.max(0.02,atKm/r.km));
      const pos=pointAlongPath(pts,frac);
      if(!pos) return;
      const m=L.circleMarker([pos.lat,pos.lng],{
        radius:7,color:"#041016",weight:2,fillColor:"#22d3ee",fillOpacity:1
      }).addTo(map).bindPopup("<b>"+s.name+"</b><br>"+(s.desc||"")+" · "+s.at);
      mapMarkers.push(m);
    });
    try{map.fitBounds(routePoly.getBounds(),{padding:[36,36],maxZoom:15})}catch(e){}
    setTimeout(()=>map.invalidateSize(),100);
  }).catch(function(){});
}
function currentProgress(){
  if(gpsLive && distCoveredGps>0.05){
    return Math.min(100,Math.round(distCoveredGps/active.km*100));
  }
  return Math.min(100,navTick*2);
}
function nextStationIndex(progress){
  const n=active.stations.length;
  if(!n)return -1;
  return Math.min(n-1, Math.floor(progress/100*n));
}
function renderStations(r,nextIdx){
  document.getElementById("stations").innerHTML=r.stations.map((s,i)=>`
    <div class="station${i===nextIdx?" next":""}">
      <div class="dot"></div>
      <div><b>${s.name}${i===nextIdx?" · 下一站":""}</b><span>${s.desc}</span></div>
      <div class="km">${s.at}</div>
    </div>`).join("");
}
function renderTripStops(progress){
  const nextIdx=progress>=100?-1:nextStationIndex(progress);
  const stops=active.stations||[];
  if(!stops.length){
    document.getElementById("trip-stops").innerHTML=`<div class="trip-stop"><b>直达终点 · 无中途补给</b><span>—</span></div>`;
    return;
  }
  document.getElementById("trip-stops").innerHTML=stops.map((s,i)=>`
    <div class="trip-stop${i===nextIdx?" next":""}">
      <div>
        <b>${s.name}${i===nextIdx?" · 下一站":""}</b>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${s.desc||""}</div>
      </div>
      <span>${s.at}</span>
    </div>`).join("");
}
function updateTripCard(progress){
  document.getElementById("nav-name").textContent=active.name;
  document.getElementById("nav-km").textContent=active.km.toFixed(1)+" km";
  document.getElementById("nav-eta").textContent=etaText(active,progress);
  document.getElementById("nav-pct").textContent=progress+"%";
  document.getElementById("nav-bar").style.width=progress+"%";
  renderTripStops(progress);
}
function visibleRoutes(){
  if(listFilter==="saved") return ROUTES.filter(r=>saved.includes(r.id));
  return ROUTES;
}
function setChip(chip){
  listFilter=chip;
  document.querySelectorAll("#chips button").forEach(x=>x.classList.toggle("on",x.dataset.chip===chip));
}
function visibleRoutesRender(){
  const list=visibleRoutes();
  document.getElementById("count").textContent=list.length+" ROUTES";
  document.getElementById("chip-saved-n").textContent=String(saved.length);
  if(!list.length){
    document.getElementById("routes").innerHTML=`<div class="routes-empty"><b>还没有收藏路线</b>选一条路线点「收藏路线」，再回来看这里</div>`;
    return;
  }
  document.getElementById("routes").innerHTML=list.map(r=>`
    <button class="route${r.id===active.id?" on":""}${r.id===flashId?" flash":""}" data-id="${r.id}">
      <b>${r.name}${saved.includes(r.id)?" ★":""}</b>
      <div class="m"><em>${r.km}km</em><span>${r.mins} min</span><span>${r.tag}</span><span>${r.stations.length} 站补给</span></div>
    </button>`).join("");
}
function render(){
  if(!navigating) setHud(active,{cadEst:true});
  document.getElementById("rname").textContent=active.name;
  document.getElementById("rtag").textContent=active.tag;
  drawMap(active);
  const nextIdx=navigating?nextStationIndex(navProgress): -1;
  renderStations(active, nextIdx);
  visibleRoutesRender();
  renderTripLog();
  document.getElementById("save").textContent=saved.includes(active.id)?"已收藏":"收藏路线";
  document.getElementById("start").disabled=navigating;
  document.getElementById("start").textContent=navigating?"导航中…":"开始导航";
  const openBtn=document.getElementById("open-start");
  if(openBtn) openBtn.disabled=navigating;
}
function clearGeoWatch(){
  if(geoWatchId!=null && navigator.geolocation){
    try{navigator.geolocation.clearWatch(geoWatchId)}catch(e){}
  }
  geoWatchId=null;
  gpsLive=false;
  lastGpsPos=null;
  gpsSpeedKmh=null;
}
function stopNav(done){
  clearInterval(navTimer);navTimer=null;
  const progress=navProgress||currentProgress();
  const elapsed=fmtElapsed(navTick);
  clearGeoWatch();
  if(done && navTick>0){
    const already=trips[0] && trips[0].routeId===active.id && trips[0].progress===100 && (Date.now()-trips[0].id)<5000;
    if(!already){
      trips.unshift({
        id:Date.now(), routeId:active.id, name:active.name,
        km:active.km, elapsed, progress:Math.min(100,progress),
        at:new Date().toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})
      });
      saveTrips();
    }
  }
  navigating=false;
  navProgress=0;
  distCoveredGps=0;
  document.getElementById("trip-card").classList.remove("open");
  setRecStatus();
  setHud(active,{cadEst:true});
  render();
  if(done) toast("导航已结束 · "+active.name);
}
function startNav(){
  if(navigating) return;
  navigating=true;
  navTick=0;
  navProgress=0;
  distCoveredGps=0;
  lastGpsPos=null;
  gpsSpeedKmh=null;
  gpsLive=false;
  const card=document.getElementById("trip-card");
  card.classList.add("open");
  updateTripCard(0);
  document.getElementById("nav-elapsed").textContent="00:00";
  setRecStatus();
  render();
  card.scrollIntoView({behavior:"smooth",block:"nearest"});
  toast("导航已启动 · "+active.name);
  clearGeoWatch();
  if(window.MashangChuangGeo){
    geoWatchId=MashangChuangGeo.watch(function(upd){
      if(!navigating||!upd||!upd.ok||!upd.pos) return;
      const p=upd.pos;
      gpsLive=true;
      setRecStatus();
      if(p.speed!=null && Number.isFinite(p.speed) && p.speed>0.3){
        gpsSpeedKmh=+(p.speed*3.6).toFixed(1);
      }
      if(lastGpsPos){
        const dm=MashangChuangGeo.haversine(lastGpsPos,p);
        if(Number.isFinite(dm) && dm>1 && dm<200){
          distCoveredGps+=dm/1000;
        }
      }
      lastGpsPos={lat:p.lat,lng:p.lng};
    });
  }
  clearInterval(navTimer);
  navTimer=setInterval(()=>{
    navTick++;
    const progress=currentProgress();
    navProgress=progress;
    document.getElementById("nav-elapsed").textContent=fmtElapsed(navTick);
    updateTripCard(progress);
    const progressDist=+(active.km*progress/100).toFixed(1);
    const distCovered=gpsLive && distCoveredGps>0.05
      ? +Math.min(active.km, distCoveredGps).toFixed(1)
      : progressDist;
    const mins=Math.max(1, Math.round(active.mins*progress/100));
    const wobble=Math.sin(navTick/3)*1.8;
    const estV=Math.max(12,active.spd+wobble);
    const v=(gpsLive && gpsSpeedKmh!=null && gpsSpeedKmh>1) ? gpsSpeedKmh : estV;
    const cad=Math.round(active.cad+Math.sin(navTick/4)*4);
    setHud(active,{spd:v,dist:distCovered,mins,cad,cadEst:true});
    renderStations(active, progress>=100?-1:nextStationIndex(progress));
    if(progress>=100){
      clearInterval(navTimer);navTimer=null;
      clearGeoWatch();
      trips.unshift({
        id:Date.now(), routeId:active.id, name:active.name,
        km:active.km, elapsed:fmtElapsed(navTick), progress:100,
        at:new Date().toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})
      });
      saveTrips();
      renderTripLog();
      toast("已到达终点");
    }
  },500);
}
function openNavToStart(){
  if(navigating){toast("请先结束当前导航");return}
  if(!window.MashangChuangGeo){toast("地图未就绪");return}
  if(active.startLat==null){
    const o=userOrigin||MashangChuangGeo.FALLBACK;
    const start=MashangChuangGeo.offsetLatLng(o.lat,o.lng,active.dNorth||0,active.dEast||0);
    active.startLat=start.lat;active.startLng=start.lng;
  }
  MashangChuangGeo.openNav({lat:active.startLat,lng:active.startLng,name:active.name+" · 起点"});
}
document.getElementById("chips").onclick=e=>{
  const b=e.target.closest("[data-chip]");if(!b)return;
  setChip(b.dataset.chip);
  const list=visibleRoutes();
  if(list.length && !list.some(r=>r.id===active.id)) active=list[0];
  render();
};
document.getElementById("routes").onclick=e=>{
  const b=e.target.closest("[data-id]");if(!b)return;
  if(navigating){toast("请先结束当前导航");return}
  active=ROUTES.find(r=>r.id===+b.dataset.id);render();
};
document.getElementById("save").onclick=()=>{
  const wasSaved=saved.includes(active.id);
  if(wasSaved) saved=saved.filter(id=>id!==active.id);
  else saved.unshift(active.id);
  saveSaved();
  if(!wasSaved){
    setChip("saved");
    flashId=active.id;
    const panel=document.getElementById("list-panel");
    panel.classList.add("fav-focus");
    toast("路线已收藏 · 已切换到收藏列表");
    render();
    document.querySelector(`.route[data-id="${active.id}"]`)?.scrollIntoView({behavior:"smooth",block:"nearest"});
    clearTimeout(window.__fav);window.__fav=setTimeout(()=>{
      flashId=null;panel.classList.remove("fav-focus");render();
    },1600);
  } else {
    toast("已取消收藏");
    render();
  }
};
document.getElementById("start").onclick=()=>startNav();
document.getElementById("open-start").onclick=()=>openNavToStart();
document.getElementById("nav-end").onclick=()=>stopNav(true);
document.getElementById("trip-clear").onclick=()=>{
  if(!trips.length){toast("暂无行程记录");return}
  trips=[];saveTrips();renderTripLog();toast("行程记录已清空");
};
</script>

<script src="/apps/_shared/geo.js"></script>
<script src="/apps/_shared/auth.js"></script>
<script>
(function(){
  if(!window.MashangChuangAuth) return;
  MashangChuangAuth.boot({
    requireLogin: false,
    appName: '骑行城市线',
    onReady: function(user){
      window.__MSC_USER__ = user;
      document.dispatchEvent(new CustomEvent('msc-auth-ready', { detail: user }));
      try {
        window.__MSC_ME__ = MashangChuangAuth.meLabel('我');
      } catch(e) {}
      saved = MashangChuangAuth.readJSON(KEY, []) || [];
      trips = MashangChuangAuth.readJSON(TRIP_KEY, []) || [];
      document.getElementById("relocate-btn")?.addEventListener("click", function(){ refreshLocation(true); });
      if(window.MashangChuangGeo){
        enrichRoutes(MashangChuangGeo.FALLBACK);
        if(typeof render === 'function') render();
        refreshLocation(false);
      } else if(typeof render === 'function') {
        render();
      }
    }
  });
})();
</script>
