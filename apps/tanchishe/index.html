<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0f1e">
  <title>贪吃蛇</title>
  <style>
    :root {
      --bg: #0a0f1e;
      --panel: rgba(20, 28, 48, 0.88);
      --border: rgba(140, 180, 255, 0.12);
      --text: #e8ecf4;
      --text-dim: #8a93a8;
      --green: #9dff8a;
      --gold: #ffd54a;
      --red: #ff5252;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(1200px 800px at 50% -10%, #16213e 0%, var(--bg) 55%) fixed;
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 520px;
      padding: 20px 16px;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 10px;
      text-indent: 10px;
      color: #d6ffd0;
      text-shadow: 0 0 18px rgba(125, 255, 106, 0.45), 0 0 46px rgba(125, 255, 106, 0.18);
    }

    .hud {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .hud-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 9px 0 7px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }

    .hud-label {
      font-size: 11px;
      letter-spacing: 3px;
      text-indent: 3px;
      color: var(--text-dim);
    }

    .hud-value {
      display: block;
      font-size: 21px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    #score { color: var(--green); text-shadow: 0 0 10px rgba(157, 255, 138, 0.45); }
    #best { color: var(--gold); text-shadow: 0 0 10px rgba(255, 213, 74, 0.4); }

    .hud-value.pop {
      animation: pop 0.32s ease;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.35); color: #ffffff; }
      100% { transform: scale(1); }
    }

    .board-wrap {
      position: relative;
      width: min(92vw, 480px, calc(100vh - 250px));
      width: min(92vw, 480px, calc(100dvh - 250px));
      aspect-ratio: 1;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      background: #0d1226;
      border: 1px solid rgba(125, 255, 106, 0.18);
      box-shadow: 0 0 28px rgba(125, 255, 106, 0.08), inset 0 0 48px rgba(0, 0, 0, 0.45);
      touch-action: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: rgba(8, 12, 26, 0.66);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 24px 28px;
      text-align: center;
      transform: translateY(10px);
      transition: transform 0.25s ease;
    }

    #overlay.visible .panel {
      transform: translateY(0);
    }

    .hidden { display: none !important; }

    .panel-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 6px;
      text-indent: 6px;
      color: #d6ffd0;
      text-shadow: 0 0 16px rgba(125, 255, 106, 0.4);
    }

    #over-title {
      color: #ff8a8a;
      text-shadow: 0 0 16px rgba(255, 82, 82, 0.4);
    }

    #over-title.win {
      color: #b6ffad;
      text-shadow: 0 0 16px rgba(125, 255, 106, 0.4);
    }

    .panel-desc {
      font-size: 13px;
      line-height: 1.9;
      color: var(--text-dim);
    }

    .panel-hint {
      font-size: 11px;
      letter-spacing: 1px;
      color: rgba(138, 147, 168, 0.7);
    }

    .record-badge {
      display: inline-block;
      padding: 4px 16px;
      border: 1px solid rgba(255, 213, 74, 0.6);
      border-radius: 999px;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 3px;
      text-indent: 3px;
      box-shadow: 0 0 14px rgba(255, 213, 74, 0.25);
      animation: badgePulse 1.2s ease-in-out infinite;
    }

    @keyframes badgePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .stats {
      display: flex;
      gap: 22px;
      justify-content: center;
      margin: 2px 0 4px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-width: 72px;
      padding: 10px 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
    }

    .stat-label {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--text-dim);
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .score-color { color: var(--green); }
    .gold-color { color: var(--gold); }

    .btn {
      padding: 11px 38px;
      border: 1px solid rgba(125, 255, 106, 0.45);
      border-radius: 999px;
      background: linear-gradient(135deg, #2f9e44, #1f7a33);
      color: #eaffea;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 4px;
      text-indent: 4px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(125, 255, 106, 0.25), 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 26px rgba(125, 255, 106, 0.45), 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 0 12px rgba(125, 255, 106, 0.3);
    }

    .tips {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 1px;
      user-select: none;
    }

    @media (max-width: 380px) {
      h1 { font-size: 22px; letter-spacing: 7px; text-indent: 7px; }
      .hud-value { font-size: 18px; }
      .stat-value { font-size: 20px; }
      .panel { padding: 18px 20px; gap: 11px; }
      .panel-title { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <header>
      <h1>贪吃蛇</h1>
      <div class="hud">
        <div class="hud-item">
          <span class="hud-label">得分</span>
          <span class="hud-value" id="score">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">最高分</span>
          <span class="hud-value" id="best">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">长度</span>
          <span class="hud-value" id="len">3</span>
        </div>
      </div>
    </header>

    <div class="board-wrap" id="board-wrap">
      <canvas id="board" width="480" height="480"></canvas>
      <div id="overlay">
        <div class="panel" id="panel-start">
          <div class="panel-title">准备开始</div>
          <p class="panel-desc">方向键 / WASD 移动 · 空格 / P 暂停<br>移动端滑动屏幕即可变向</p>
          <button class="btn" id="btn-start" type="button">开始游戏</button>
        </div>
        <div class="panel hidden" id="panel-pause">
          <div class="panel-title">已暂停</div>
          <p class="panel-desc">按 空格 / P 或点击按钮继续</p>
          <button class="btn" id="btn-resume" type="button">继续游戏</button>
        </div>
        <div class="panel hidden" id="panel-over">
          <div class="panel-title" id="over-title">游戏结束</div>
          <div class="record-badge hidden" id="new-record">新纪录！</div>
          <div class="stats">
            <div class="stat">
              <span class="stat-label">本局得分</span>
              <span class="stat-value score-color" id="final-score">0</span>
            </div>
            <div class="stat">
              <span class="stat-label">蛇身长度</span>
              <span class="stat-value" id="final-len">3</span>
            </div>
            <div class="stat">
              <span class="stat-label">历史最高</span>
              <span class="stat-value gold-color" id="final-best">0</span>
            </div>
          </div>
          <button class="btn" id="btn-restart" type="button">再来一局</button>
          <p class="panel-hint">按 空格 / 回车 快速重开</p>
        </div>
      </div>
    </div>

    <footer class="tips">
      <span>方向键 / WASD 移动 ｜ 空格 / P 暂停</span>
      <span>移动端：滑动屏幕变向</span>
    </footer>
  </div>

  <script>
    (() => {
      'use strict';

      const GRID = 21;
      const BASE_SPEED = 150;
      const MIN_SPEED = 60;
      const SPEED_STEP = 2.5;
      const BEST_KEY = 'snake_best';
      const DEATH_FLASH_MS = 450;
      const SWIPE_THRESHOLD = 24;
      const DIR_QUEUE_MAX = 2;

      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const wrapEl = document.getElementById('board-wrap');
      const overlayEl = document.getElementById('overlay');
      const panelStart = document.getElementById('panel-start');
      const panelPause = document.getElementById('panel-pause');
      const panelOver = document.getElementById('panel-over');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const lenEl = document.getElementById('len');
      const overTitleEl = document.getElementById('over-title');
      const finalScoreEl = document.getElementById('final-score');
      const finalLenEl = document.getElementById('final-len');
      const finalBestEl = document.getElementById('final-best');
      const newRecordEl = document.getElementById('new-record');

      let viewSize = 480;
      let cell = viewSize / GRID;
      let snake = [];
      let dir = { x: 1, y: 0 };
      let dirQueue = [];
      let food = null;
      let score = 0;
      let best = loadBest();
      let alive = false;
      let state = 'start';
      let beatRecord = false;
      let deathAt = 0;
      let acc = 0;
      let lastT = 0;

      bestEl.textContent = best;

      function loadBest() {
        try {
          const v = parseInt(localStorage.getItem(BEST_KEY), 10);
          return Number.isFinite(v) && v > 0 ? v : 0;
        } catch (err) {
          return 0;
        }
      }

      function saveBest(value) {
        try {
          localStorage.setItem(BEST_KEY, String(value));
        } catch (err) {}
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const size = Math.round(Math.max(rect.width, 1) * dpr);
        if (size === viewSize && canvas.width === size) return;
        viewSize = size;
        canvas.width = viewSize;
        canvas.height = viewSize;
        cell = viewSize / GRID;
      }

      function resetGame() {
        const mid = Math.floor(GRID / 2);
        snake = [
          { x: mid, y: mid },
          { x: mid - 1, y: mid },
          { x: mid - 2, y: mid }
        ];
        dir = { x: 1, y: 0 };
        dirQueue = [];
        score = 0;
        alive = true;
        beatRecord = false;
        deathAt = 0;
        acc = 0;
        spawnFood();
        updateHud(false);
      }

      function spawnFood() {
        const occupied = new Set(snake.map(s => s.x + ',' + s.y));
        const free = [];
        for (let y = 0; y < GRID; y++) {
          for (let x = 0; x < GRID; x++) {
            if (!occupied.has(x + ',' + y)) free.push({ x, y });
          }
        }
        if (free.length === 0) {
          food = null;
          finishGame(true);
          return;
        }
        food = free[Math.floor(Math.random() * free.length)];
      }

      function currentSpeed() {
        return Math.max(MIN_SPEED, BASE_SPEED - (snake.length - 3) * SPEED_STEP);
      }

      function startGame() {
        resetGame();
        state = 'playing';
        showOverlay(null);
      }

      function handleDirInput(x, y) {
        if (state === 'start' || state === 'over') startGame();
        if (state !== 'playing') return;
        const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
        if ((x === last.x && y === last.y) || (x === -last.x && y === -last.y)) return;
        if (dirQueue.length < DIR_QUEUE_MAX) dirQueue.push({ x, y });
      }

      function togglePause() {
        if (state === 'playing') {
          state = 'paused';
          showOverlay(panelPause);
        } else if (state === 'paused') {
          state = 'playing';
          showOverlay(null);
        }
      }

      function tick() {
        if (dirQueue.length) dir = dirQueue.shift();
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
          finishGame(false);
          return;
        }
        const eating = food !== null && head.x === food.x && head.y === food.y;
        const body = eating ? snake : snake.slice(0, -1);
        for (let i = 0; i < body.length; i++) {
          if (body[i].x === head.x && body[i].y === head.y) {
            finishGame(false);
            return;
          }
        }
        snake.unshift(head);
        if (eating) {
          score += 10;
          if (score > best) {
            best = score;
            beatRecord = true;
            saveBest(best);
          }
          spawnFood();
          updateHud(true);
        } else {
          snake.pop();
        }
      }

      function finishGame(win) {
        alive = false;
        deathAt = win ? 0 : performance.now();
        state = 'dying';
        overTitleEl.textContent = win ? '通关了！' : '游戏结束';
        overTitleEl.classList.toggle('win', win);
        setTimeout(() => {
          state = 'over';
          finalScoreEl.textContent = score;
          finalLenEl.textContent = snake.length;
          finalBestEl.textContent = best;
          newRecordEl.classList.toggle('hidden', !beatRecord);
          showOverlay(panelOver);
        }, win ? 150 : 520);
      }

      function updateHud(pulse) {
        scoreEl.textContent = score;
        bestEl.textContent = best;
        lenEl.textContent = snake.length;
        if (pulse) {
          flashHud(scoreEl);
          flashHud(lenEl);
          if (beatRecord) flashHud(bestEl);
        }
      }

      function flashHud(el) {
        el.classList.remove('pop');
        void el.offsetWidth;
        el.classList.add('pop');
      }

      function showOverlay(panel) {
        if (panel) {
          overlayEl.classList.add('visible');
          panelStart.classList.toggle('hidden', panel !== panelStart);
          panelPause.classList.toggle('hidden', panel !== panelPause);
          panelOver.classList.toggle('hidden', panel !== panelOver);
        } else {
          overlayEl.classList.remove('visible');
        }
      }

      function loop(t) {
        requestAnimationFrame(loop);
        const dt = Math.min(t - lastT, 100);
        lastT = t;
        if (state === 'playing') {
          acc += dt;
          let steps = 0;
          while (alive && acc >= currentSpeed() && steps < 8) {
            acc -= currentSpeed();
            tick();
            steps++;
          }
          if (!alive) acc = 0;
        }
        render(t);
      }

      function render(t) {
        ctx.clearRect(0, 0, viewSize, viewSize);
        drawGrid();
        if (food) drawFood(t);
        drawSnake();
        if (!alive && deathAt) {
          const elapsed = t - deathAt;
          if (elapsed < DEATH_FLASH_MS) {
            const alpha = 0.5 * (1 - elapsed / DEATH_FLASH_MS);
            ctx.fillStyle = 'rgba(255, 70, 70, ' + alpha.toFixed(3) + ')';
            ctx.fillRect(0, 0, viewSize, viewSize);
          }
        }
      }

      function drawGrid() {
        ctx.strokeStyle = 'rgba(160, 190, 255, 0.05)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 1; i < GRID; i++) {
          const p = Math.round(i * cell) + 0.5;
          ctx.moveTo(p, 0);
          ctx.lineTo(p, viewSize);
          ctx.moveTo(0, p);
          ctx.lineTo(viewSize, p);
        }
        ctx.stroke();
      }

      function drawFood(t) {
        const pulse = (Math.sin(t / 180) + 1) / 2;
        const cx = (food.x + 0.5) * cell;
        const cy = (food.y + 0.5) * cell;
        const r = cell * (0.3 + 0.08 * pulse);
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        grad.addColorStop(0, '#ffe08a');
        grad.addColorStop(0.55, '#ff9e3d');
        grad.addColorStop(1, '#ff4d4d');
        ctx.save();
        ctx.shadowColor = 'rgba(255, 120, 60, ' + (0.5 + 0.4 * pulse).toFixed(2) + ')';
        ctx.shadowBlur = cell * (0.5 + 0.5 * pulse);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawSnake() {
        const n = snake.length;
        const pad = cell * 0.08;
        for (let i = n - 1; i >= 0; i--) {
          const seg = snake[i];
          const ratio = n === 1 ? 1 : 1 - i / (n - 1);
          const r = Math.round(40 + 130 * ratio);
          const g = Math.round(110 + 145 * ratio);
          const b = Math.round(70 + 55 * ratio);
          ctx.save();
          ctx.shadowColor = 'rgba(110, 255, 120, 0.5)';
          ctx.shadowBlur = 4 + 12 * ratio;
          ctx.fillStyle = 'rgb(' + r + ', ' + g + ', ' + b + ')';
          roundRect(seg.x * cell + pad, seg.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.3);
          ctx.fill();
          ctx.restore();
        }
        drawEyes();
      }

      function roundRect(x, y, w, h, radius) {
        const rr = Math.min(radius, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.arcTo(x + w, y, x + w, y + rr, rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
        ctx.lineTo(x + rr, y + h);
        ctx.arcTo(x, y + h, x, y + h - rr, rr);
        ctx.lineTo(x, y + rr);
        ctx.arcTo(x, y, x + rr, y, rr);
        ctx.closePath();
      }

      function drawEyes() {
        if (!snake.length) return;
        const head = snake[0];
        const cx = (head.x + 0.5) * cell;
        const cy = (head.y + 0.5) * cell;
        const px = -dir.y;
        const py = dir.x;
        const eyeOffset = cell * 0.18;
        const forward = cell * 0.16;
        const radius = Math.max(1.5, cell * 0.075);
        ctx.fillStyle = '#08130b';
        for (let side = -1; side <= 1; side += 2) {
          const ex = cx + dir.x * forward + px * eyeOffset * side;
          const ey = cy + dir.y * forward + py * eyeOffset * side;
          ctx.beginPath();
          ctx.arc(ex, ey, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const KEY_DIRS = {
        arrowup: [0, -1],
        arrowdown: [0, 1],
        arrowleft: [-1, 0],
        arrowright: [1, 0],
        w: [0, -1],
        s: [0, 1],
        a: [-1, 0],
        d: [1, 0]
      };

      document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (KEY_DIRS[key]) {
          e.preventDefault();
          handleDirInput(KEY_DIRS[key][0], KEY_DIRS[key][1]);
          return;
        }
        if (key === ' ') {
          e.preventDefault();
          if (state === 'playing' || state === 'paused') togglePause();
          else if (state === 'start' || state === 'over') startGame();
          return;
        }
        if (key === 'p') {
          if (state === 'playing' || state === 'paused') togglePause();
          return;
        }
        if (key === 'enter' && state === 'over') {
          startGame();
        }
      });

      let touchX = 0;
      let touchY = 0;
      let touchActive = false;

      wrapEl.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        touchX = t.clientX;
        touchY = t.clientY;
        touchActive = true;
      }, { passive: true });

      wrapEl.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!touchActive) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchX;
        const dy = t.clientY - touchY;
        if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) return;
        touchActive = false;
        if (Math.abs(dx) > Math.abs(dy)) {
          handleDirInput(dx > 0 ? 1 : -1, 0);
        } else {
          handleDirInput(0, dy > 0 ? 1 : -1);
        }
      }, { passive: false });

      wrapEl.addEventListener('touchend', () => {
        touchActive = false;
      }, { passive: true });

      wrapEl.addEventListener('touchcancel', () => {
        touchActive = false;
      }, { passive: true });

      document.getElementById('btn-start').addEventListener('click', startGame);
      document.getElementById('btn-resume').addEventListener('click', togglePause);
      document.getElementById('btn-restart').addEventListener('click', startGame);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && state === 'playing') togglePause();
      });

      window.addEventListener('resize', resize);
      if (typeof ResizeObserver === 'function') {
        new ResizeObserver(resize).observe(canvas);
      }

      resize();
      resetGame();
      state = 'start';
      showOverlay(panelStart);
      requestAnimationFrame(loop);
    })();
  </script>
</body>
