<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电子木鱼</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f1923'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle'%3E🛐%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0e14;--bg2:#141821;--card:#1a2030;--border:#2a3040;--text:#e6f0fa;--muted:#7a8fa3;--gold:#d4a056;--gold2:#ffd700;--red:#c0392b;--incense:#8b6914}
html,body{height:100%}
body{background:radial-gradient(ellipse at top,#1a1520,#0a0e14 70%);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden;user-select:none}
.page{display:none;flex-direction:column;align-items:center;width:100%;max-width:480px;padding:20px 16px;min-height:100vh}
.page.active{display:flex}

/* === 界面1: 寺庙入口 === */
.temple-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;width:100%}
.temple-svg{width:260px;height:240px;cursor:pointer;filter:drop-shadow(0 0 30px rgba(212,160,86,.3));transition:transform .3s}
.temple-svg:hover{transform:scale(1.03)}
.temple-hint{font-size:16px;color:var(--gold);letter-spacing:4px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.petal{position:fixed;width:8px;height:8px;background:rgba(212,160,86,.3);border-radius:0 100% 0 100%;pointer-events:none;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:0}10%{opacity:.6}90%{opacity:.4}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* === 界面2: 祈愿 === */
.wish-title{font-size:22px;color:var(--gold);margin:40px 0 24px;letter-spacing:3px}
.wish-box{width:100%;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.wish-box label{font-size:14px;color:var(--muted)}
.wish-box input,.wish-box textarea{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-size:15px;font-family:inherit;transition:border-color .2s}
.wish-box input:focus,.wish-box textarea:focus{outline:none;border-color:var(--gold)}
.wish-box textarea{resize:none;height:70px}
.wish-btns{display:flex;gap:12px;margin-top:20px}
.btn{flex:1;padding:12px;border-radius:10px;border:none;font-size:15px;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--gold);color:#0a0e14;font-weight:600}
.btn-primary:hover{background:var(--gold2)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}

/* === 界面3: 修行 === */
.practice{gap:12px}
.practice-header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.practice-header .back-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-family:inherit}
.practice-header .back-btn:hover{color:var(--gold)}
.wish-display{text-align:center;padding:8px 16px;background:linear-gradient(135deg,rgba(212,160,86,.08),transparent);border-top:1px solid rgba(212,160,86,.2);border-bottom:1px solid rgba(212,160,86,.2);width:100%}
.wish-display .wt{font-size:17px;color:var(--gold);letter-spacing:2px}
.wish-display .wd{font-size:13px;color:var(--muted);margin-top:4px}

/* 佛像 */
.buddha-area{display:flex;flex-direction:column;align-items:center;gap:6px}
.buddha-svg{width:100px;height:110px;filter:drop-shadow(0 0 15px rgba(255,215,0,.25))}

/* 香坛 */
.incense-area{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.incense-row{display:flex;gap:20px;align-items:flex-end;height:70px;position:relative}
.incense-stick{width:4px;height:60px;background:linear-gradient(to top,#5a4020,#8b6914 80%,#c0392b 95%,#ff6b3a);border-radius:2px;position:relative;transition:height .5s linear}
.incense-stick .smoke{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:12px;height:30px;opacity:0}
.incense-stick.burning .smoke{animation:smoke 2s ease-in-out infinite}
.incense-stick.burning .smoke:nth-child(2){animation-delay:.5s;left:30%}
.incense-stick.burning .smoke:nth-child(3){animation-delay:1s;left:70%}
@keyframes smoke{0%{opacity:0;transform:translateX(-50%) translateY(0) scale(.5)}30%{opacity:.4}100%{opacity:0;transform:translateX(-50%) translateY(-40px) scale(1.5)}}
.incense-stick .glow{position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:8px;height:8px;background:radial-gradient(circle,#ff6b3a,#c0392b 60%,transparent);border-radius:50%;animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{0%{opacity:.6;transform:translateX(-50%) scale(.8)}100%{opacity:1;transform:translateX(-50%) scale(1.2)}}
.incense-stick.burnt{height:15px;background:#3a3020}
.incense-stick.burnt .glow,.incense-stick.burnt .smoke{display:none}
.censer{width:80px;height:20px;background:linear-gradient(to bottom,#5a4030,#3a2820);border-radius:4px 4px 12px 12px;position:relative;margin-top:-2px}
.censer::before{content:"";position:absolute;top:0;left:5px;right:5px;height:4px;background:#2a1810;border-radius:50%}
.incense-btn{background:var(--card);border:1px solid var(--border);color:var(--gold);border-radius:8px;padding:5px 14px;cursor:pointer;font-size:12px;font-family:inherit;margin-top:4px}
.incense-btn:hover{border-color:var(--gold)}

/* 木鱼 */
.fish-area{position:relative;display:flex;align-items:center;justify-content:center;height:210px;width:100%;margin-top:18px}
.fish-clickable{position:relative;cursor:pointer;width:180px;height:190px}
.fish-svg{position:absolute;bottom:0;left:50%;margin-left:-90px;width:180px;height:130px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));transition:transform .08s}
.fish-clickable.hit .fish-svg{animation:fishHit .15s ease}
@keyframes fishHit{0%{transform:scale(1)}30%{transform:scale(.93)}100%{transform:scale(1)}}
/* 木鱼槌 - 竖立在木鱼上方 */
.stick{position:absolute;left:50%;top:15px;width:24px;height:62px;transform-origin:50% 8px;transform:translateX(-50%) rotate(26deg);transition:transform .08s cubic-bezier(.4,0,.6,1);pointer-events:none;z-index:5}
.stick .stick-handle{width:15px;height:18px;background:linear-gradient(to bottom,#8a6224,#3a2008);border-radius:8px 8px 5px 5px;position:absolute;left:4.5px;top:0;box-shadow:inset -2px 0 3px rgba(0,0,0,.35)}
.stick .stick-body{width:9px;height:34px;background:linear-gradient(to right,#c8a860,#7a561c 45%,#c8a860);border-radius:4px;position:absolute;left:7.5px;top:16px}
.stick .stick-head{width:24px;height:24px;background:radial-gradient(circle at 38% 32%,#e8c878,#a07820 55%,#5a4020);border-radius:50%;position:absolute;left:0;bottom:0;box-shadow:0 3px 8px rgba(0,0,0,.5),inset -3px -3px 6px rgba(0,0,0,.3)}
.fish-clickable.hit .stick{animation:stickHit .15s ease}
@keyframes stickHit{0%{transform:translateX(-50%) rotate(26deg)}40%{transform:translateX(-50%) rotate(-12deg)}100%{transform:translateX(-50%) rotate(26deg)}}

.float-text{position:absolute;font-size:22px;font-weight:700;color:var(--gold2);pointer-events:none;animation:floatUp 1s ease-out forwards;text-shadow:0 0 10px rgba(255,215,0,.6);z-index:10}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(1.3)}}
.quote{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:16px;color:var(--gold);opacity:0;transition:opacity .3s;white-space:nowrap;letter-spacing:2px;z-index:10;text-shadow:0 2px 8px rgba(0,0,0,.85)}
.quote.show{opacity:1}

/* 统计 */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center}
.stat .v{font-size:22px;font-weight:700;color:var(--gold);line-height:1.2;font-variant-numeric:tabular-nums}
.stat .k{font-size:10px;color:var(--muted);margin-top:3px}
.stat.combo .v{color:var(--gold2)}

/* 控制 */
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;padding-top:4px}
.ctrl{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .2s}
.ctrl:hover{border-color:var(--gold);color:var(--gold)}
.ctrl.on{border-color:var(--gold);color:var(--gold);background:rgba(212,160,86,.1)}
.ctrl.danger:hover{border-color:var(--red);color:var(--red)}

/* 自动敲击设置面板 */
.auto-panel{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-top:6px;display:none;flex-direction:column;gap:8px}
.auto-panel.show{display:flex}
.auto-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.auto-row span:first-child{min-width:30px}
.auto-row input[type=range]{flex:1;accent-color:var(--gold)}
.auto-row select{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:12px;font-family:inherit}
.auto-row #freqVal{min-width:42px;text-align:right;color:var(--gold);font-variant-numeric:tabular-nums}
.auto-row #durCountdown{color:var(--gold2);font-variant-numeric:tabular-nums}

/* 特效层 */
.fx-layer{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50}
.buddha-light{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at center,rgba(255,215,0,.15),transparent 60%);pointer-events:none;opacity:0;z-index:49}
.buddha-light.show{animation:buddhaFx 2s ease-out forwards}
@keyframes buddhaFx{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

@media(max-width:380px){.fish-clickable{width:170px;height:180px}.fish-svg{width:170px;margin-left:-85px}.stick{top:8px}.buddha-svg{width:80px;height:90px}.stat .v{font-size:18px}}
</style>
</head>
<body>

<!-- 界面1: 寺庙入口 -->
<div class="page active" id="page1">
<div class="temple-wrap">
<svg class="temple-svg" id="templeEnter" viewBox="0 0 260 240">
<defs>
<linearGradient id="roofG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9b3a24"/><stop offset="0.55" stop-color="#5a2010"/><stop offset="1" stop-color="#341008"/></linearGradient>
<linearGradient id="roofG2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a2e1c"/><stop offset="1" stop-color="#28100a"/></linearGradient>
<linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9984a"/><stop offset="0.5" stop-color="#9a6e26"/><stop offset="1" stop-color="#5e400e"/></linearGradient>
<linearGradient id="pillarG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a1410"/><stop offset="0.5" stop-color="#a02a20"/><stop offset="1" stop-color="#4a1410"/></linearGradient>
<linearGradient id="stepG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a5a48"/><stop offset="1" stop-color="#2e2620"/></linearGradient>
<radialGradient id="glowG" cx=".5" cy=".42"><stop offset="0" stop-color="#ffd700" stop-opacity=".30"/><stop offset="1" stop-color="#ffd700" stop-opacity="0"/></radialGradient>
<radialGradient id="lampG" cx=".5" cy=".35"><stop offset="0" stop-color="#ffdd66"/><stop offset="1" stop-color="#c0392b"/></radialGradient>
</defs>
<ellipse cx="130" cy="105" rx="120" ry="100" fill="url(#glowG)"/>
<!-- 宝顶 -->
<line x1="130" y1="30" x2="130" y2="47" stroke="#ffd700" stroke-width="2.5"/>
<circle cx="130" cy="28" r="5" fill="#ffd700"/>
<!-- 上层屋顶 -->
<path d="M108 48 L152 48 L188 84 Q196 79 204 74 Q130 104 56 74 Q64 79 72 84 Z" fill="url(#roofG)"/>
<path d="M204 74 Q130 104 56 74" fill="none" stroke="#c08018" stroke-width="1.2" opacity=".7"/>
<!-- 上层匾额 -->
<rect x="112" y="86" width="36" height="15" rx="2" fill="#3a1a0c" stroke="#c0a050" stroke-width="1"/>
<text x="130" y="97.5" font-size="11" text-anchor="middle" fill="#e6c060" font-family="serif">禅寺</text>
<!-- 下层屋顶 -->
<path d="M92 100 L168 100 L214 140 Q222 135 230 130 Q130 162 30 130 Q38 135 46 140 Z" fill="url(#roofG2)"/>
<path d="M230 130 Q130 162 30 130" fill="none" stroke="#c08018" stroke-width="1.2" opacity=".55"/>
<!-- 墙体 -->
<rect x="68" y="140" width="124" height="66" fill="url(#wallG)"/>
<rect x="64" y="140" width="132" height="6" fill="#4a2a10"/>
<!-- 柱子 -->
<rect x="74" y="150" width="11" height="56" fill="url(#pillarG)" rx="2"/>
<rect x="175" y="150" width="11" height="56" fill="url(#pillarG)" rx="2"/>
<!-- 门洞 -->
<path d="M108 206 L108 172 Q130 158 152 172 L152 206 Z" fill="#160a04"/>
<circle cx="130" cy="188" r="15" fill="#ffd700" opacity=".13"/>
<text x="130" y="194" font-size="16" text-anchor="middle" fill="#e6c060" font-family="serif" opacity=".9">禅</text>
<!-- 台阶 -->
<rect x="58" y="206" width="144" height="8" fill="url(#stepG)"/>
<rect x="46" y="214" width="168" height="8" fill="url(#stepG)"/>
<rect x="34" y="222" width="192" height="8" fill="url(#stepG)"/>
<!-- 灯笼 -->
<line x1="60" y1="146" x2="60" y2="158" stroke="#5a2010" stroke-width="1"/>
<ellipse cx="60" cy="166" rx="9" ry="11" fill="url(#lampG)"/>
<ellipse cx="60" cy="166" rx="9" ry="11" fill="none" stroke="#ffd700" stroke-width=".8" opacity=".5"/>
<line x1="200" y1="146" x2="200" y2="158" stroke="#5a2010" stroke-width="1"/>
<ellipse cx="200" cy="166" rx="9" ry="11" fill="url(#lampG)"/>
<ellipse cx="200" cy="166" rx="9" ry="11" fill="none" stroke="#ffd700" stroke-width=".8" opacity=".5"/>
</svg>
<div class="temple-hint">点击进入，诚心叩拜</div>
</div>
</div>

<!-- 界面2: 祈愿输入 -->
<div class="page" id="page2">
<div class="wish-title">写下你的祈愿</div>
<div class="wish-box">
<label>祈愿标题</label>
<input type="text" id="wishInput" placeholder="如：祈求学业顺利" maxlength="20">
<label>一句话（选填）</label>
<textarea id="wishDesc" placeholder="如：愿一切顺利，心想事成" maxlength="50"></textarea>
</div>
<div class="wish-btns">
<button class="btn btn-ghost" onclick="showPage(1)">返回</button>
<button class="btn btn-primary" id="startPractice">开始叩拜</button>
</div>
</div>

<!-- 界面3: 修行 -->
<div class="page practice" id="page3">
<div class="practice-header">
<button class="back-btn" onclick="showPage(2)">← 修改祈愿</button>
<span style="font-size:13px;color:var(--muted)" id="timeNow"></span>
</div>

<div class="wish-display">
<div class="wt" id="wishTitle">诚心叩拜</div>
<div class="wd" id="wishDescDisplay"></div>
</div>

<div class="buddha-area">
<svg class="buddha-svg" viewBox="0 0 100 110">
<defs>
<radialGradient id="halo" cx=".5" cy=".34"><stop offset="0" stop-color="#ffe680" stop-opacity=".5"/><stop offset=".55" stop-color="#ffd700" stop-opacity=".16"/><stop offset="1" stop-color="#ffd700" stop-opacity="0"/></radialGradient>
<radialGradient id="haloRing" cx=".5" cy=".5"><stop offset=".76" stop-color="#ffd700" stop-opacity="0"/><stop offset=".9" stop-color="#ffd700" stop-opacity=".42"/><stop offset="1" stop-color="#ffd700" stop-opacity="0"/></radialGradient>
<linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d79a"/><stop offset="1" stop-color="#c9a253"/></linearGradient>
<linearGradient id="robe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8b84a"/><stop offset=".5" stop-color="#c8952a"/><stop offset="1" stop-color="#8a5e16"/></linearGradient>
<linearGradient id="robeDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8952a"/><stop offset="1" stop-color="#6e4810"/></linearGradient>
<linearGradient id="lotusG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb0b8"/><stop offset="1" stop-color="#b8556a"/></linearGradient>
<radialGradient id="hairG" cx=".5" cy=".3"><stop offset="0" stop-color="#3f6285"/><stop offset="1" stop-color="#243c56"/></radialGradient>
</defs>
<!-- 背光 -->
<circle cx="50" cy="38" r="36" fill="url(#halo)"/>
<circle cx="50" cy="38" r="31" fill="url(#haloRing)"/>
<!-- 莲花座 -->
<ellipse cx="50" cy="100" rx="33" ry="7" fill="#6a1a2a"/>
<path d="M20 99 Q24 89 34 91 Q40 83 50 85 Q60 83 66 91 Q76 89 80 99 Z" fill="url(#lotusG)"/>
<path d="M28 97 Q34 91 40 95 M44 93 Q50 89 56 93 M60 95 Q66 91 72 97" fill="none" stroke="#8a3548" stroke-width="1" opacity=".6"/>
<!-- 身体袈裟 -->
<path d="M33 58 Q31 53 38 50 Q43 47 50 47 Q57 47 62 50 Q69 53 67 58 L65 88 Q50 95 35 88 Z" fill="url(#robe)"/>
<path d="M50 48 Q58 59 60 74 L56 76 Q53 62 46 52 Z" fill="url(#robeDark)"/>
<path d="M50 48 Q42 60 40 76" fill="none" stroke="#8a5e16" stroke-width="1.2" opacity=".7"/>
<!-- 双手禅定印 -->
<path d="M41 86 Q50 82 59 86 Q57 92 50 92 Q43 92 41 86 Z" fill="url(#skin)"/>
<path d="M46 86 Q50 84 54 86" fill="none" stroke="#b08840" stroke-width=".8"/>
<!-- 脖子 -->
<rect x="45" y="42" width="10" height="8" fill="url(#skin)"/>
<!-- 长耳垂 -->
<ellipse cx="38.5" cy="32" rx="2.6" ry="6.5" fill="url(#skin)"/>
<ellipse cx="61.5" cy="32" rx="2.6" ry="6.5" fill="url(#skin)"/>
<!-- 脸 -->
<ellipse cx="50" cy="31" rx="11" ry="12" fill="url(#skin)"/>
<!-- 螺发 -->
<path d="M39 25 Q39 15 50 12 Q61 15 61 25 Q50 21 39 25 Z" fill="url(#hairG)"/>
<ellipse cx="50" cy="12" rx="7" ry="5.5" fill="url(#hairG)"/>
<!-- 螺发螺旋 -->
<circle cx="43.5" cy="21.5" r="2" fill="#456a8f"/>
<circle cx="50" cy="20.5" r="2" fill="#456a8f"/>
<circle cx="56.5" cy="21.5" r="2" fill="#456a8f"/>
<circle cx="46.5" cy="17.5" r="1.8" fill="#456a8f"/>
<circle cx="53.5" cy="17.5" r="1.8" fill="#456a8f"/>
<circle cx="50" cy="12.5" r="2" fill="#456a8f"/>
<!-- 发际线 -->
<path d="M39.5 24 Q50 20.5 60.5 24" fill="none" stroke="#24415c" stroke-width=".7" opacity=".7"/>
<!-- 白毫 -->
<circle cx="50" cy="28" r="1.6" fill="#ffd700"/>
<!-- 眉 -->
<path d="M42.5 30 Q46 32 49.5 29.5" fill="none" stroke="#5a3a10" stroke-width="1.1" stroke-linecap="round"/>
<path d="M50.5 29.5 Q54 32 57.5 30" fill="none" stroke="#5a3a10" stroke-width="1.1" stroke-linecap="round"/>
<!-- 眼（半闭） -->
<path d="M43 33 Q46 35 49 32.5" fill="none" stroke="#5a3a10" stroke-width="1.1" stroke-linecap="round"/>
<path d="M51 32.5 Q54 35 57 33" fill="none" stroke="#5a3a10" stroke-width="1.1" stroke-linecap="round"/>
<!-- 鼻 -->
<path d="M50 33 L50 37 Q50.5 38 52 37.5" fill="none" stroke="#b08840" stroke-width=".9"/>
<!-- 嘴 -->
<path d="M46 40 Q50 42.5 54 40" fill="none" stroke="#a06030" stroke-width="1" stroke-linecap="round"/>
</svg>
</div>

<div class="incense-area">
<div class="incense-row" id="incenseRow">
<div class="incense-stick burning"><div class="glow"></div><div class="smoke"></div><div class="smoke"></div><div class="smoke"></div></div>
<div class="incense-stick burning"><div class="glow"></div><div class="smoke"></div><div class="smoke"></div><div class="smoke"></div></div>
<div class="incense-stick burning"><div class="glow"></div><div class="smoke"></div><div class="smoke"></div><div class="smoke"></div></div>
</div>
<div class="censer"></div>
<button class="incense-btn" id="incenseBtn">🙏 重新上香</button>
</div>

<div class="fish-area">
<div class="fish-clickable" id="fishClickable">
<svg class="fish-svg" viewBox="0 0 180 130">
<defs>
<radialGradient id="fishBody" cx=".38" cy=".3" r=".85">
<stop offset="0" stop-color="#e6b858"/>
<stop offset=".45" stop-color="#b8862a"/>
<stop offset=".8" stop-color="#7a5410"/>
<stop offset="1" stop-color="#422a0c"/>
</radialGradient>
<linearGradient id="fishShade" x1="0" y1="0" x2="0" y2="1">
<stop offset=".5" stop-color="#000" stop-opacity="0"/>
<stop offset="1" stop-color="#000" stop-opacity=".4"/>
</linearGradient>
</defs>
<!-- 底座阴影 -->
<ellipse cx="90" cy="113" rx="70" ry="7" fill="#000" opacity=".28"/>
<!-- 主体 -->
<ellipse cx="90" cy="64" rx="77" ry="48" fill="url(#fishBody)"/>
<ellipse cx="90" cy="64" rx="77" ry="48" fill="url(#fishShade)"/>
<!-- 音孔开口 -->
<path d="M20 66 Q90 48 160 66 Q90 82 20 66 Z" fill="#1a0f04"/>
<path d="M20 66 Q90 48 160 66" fill="none" stroke="#e6b858" stroke-width="1.5" opacity=".5"/>
<path d="M20 66 Q90 82 160 66" fill="none" stroke="#6a4a18" stroke-width="1.5" opacity=".5"/>
<!-- 木纹弧 -->
<ellipse cx="90" cy="64" rx="60" ry="34" fill="none" stroke="#8a6420" stroke-width="1.4" opacity=".4"/>
<ellipse cx="90" cy="64" rx="42" ry="22" fill="none" stroke="#8a6420" stroke-width="1.2" opacity=".35"/>
<!-- 高光 -->
<ellipse cx="60" cy="42" rx="24" ry="12" fill="#fff" opacity=".2" transform="rotate(-20 60 42)"/>
<!-- 右侧鱼尾凸起 -->
<path d="M158 52 Q176 63 158 78 Q168 65 158 52 Z" fill="#5a3a10"/>
<path d="M158 52 Q176 63 158 78" fill="none" stroke="#8a6420" stroke-width="1" opacity=".5"/>
</svg>
<div class="stick"><div class="stick-handle"></div><div class="stick-body"></div><div class="stick-head"></div></div>
</div>
<div class="quote" id="quote"></div>
</div>

<div class="stats">
<div class="stat"><div class="v" id="totalCount">0</div><div class="k">总功德</div></div>
<div class="stat"><div class="v" id="todayCount">0</div><div class="k">今日</div></div>
<div class="stat combo"><div class="v" id="comboCount">0</div><div class="k">连击</div></div>
</div>

<div class="controls">
<button class="ctrl" id="autoBtn">自动敲击</button>
<button class="ctrl on" id="soundBtn">音效</button>
<button class="ctrl danger" id="resetBtn">重置</button>
</div>
<div class="auto-panel" id="autoPanel">
<div class="auto-row"><span>频率</span><input type="range" id="freqSlider" min="100" max="800" step="50" value="200"><span id="freqVal">200ms</span></div>
<div class="auto-row"><span>时长</span><select id="durSelect"><option value="0">无限</option><option value="30">30秒</option><option value="60">1分钟</option><option value="180">3分钟</option><option value="300">5分钟</option><option value="600">10分钟</option></select><span id="durCountdown"></span></div>
</div>
<div style="text-align:center;font-size:11px;line-height:1.8;color:rgba(255,255,255,.5);padding:10px 4px 2px;letter-spacing:.3px">本应用仅为放松减压与趣味互动工具，不涉及任何宗教宣传或信仰引导。</div>
</div>

<div class="fx-layer" id="fxLayer"></div>
<div class="buddha-light" id="buddhaLight"></div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var pages={1:$("page1"),2:$("page2"),3:$("page3")};
var totalCount=0,todayCount=0,combo=0,lastHit=0;
var soundOn=true,autoOn=false,autoTimer=null,autoFreq=200,autoDur=0,autoDurTimer=null,autoDurRemain=0;
var incenseTimer=null,incenseProgress=[1,1,1];
var QUOTES=["功德+1","阿弥陀佛","善哉善哉","清净无为","般若波罗蜜","色即是空","应无所住","一心向善","功德无量","随喜赞叹"];

function loadState(){
totalCount=parseInt(localStorage.getItem("woodfish_count")||"0");
todayCount=parseInt(localStorage.getItem("woodfish_today")||"0");
var td=localStorage.getItem("woodfish_today_date");
var today=new Date().toDateString();
if(td!==today){todayCount=0;localStorage.setItem("woodfish_today_date",today);}
 soundOn=localStorage.getItem("woodfish_sound")!=="0";
 autoOn=localStorage.getItem("woodfish_auto")==="1";
 autoFreq=parseInt(localStorage.getItem("woodfish_freq")||"200");
 autoDur=parseInt(localStorage.getItem("woodfish_dur")||"0");
 var w=localStorage.getItem("woodfish_wish");
if(w){try{var wish=JSON.parse(w);$("wishInput").value=wish.title||"";$("wishDesc").value=wish.desc||"";}catch(e){}}
}
function saveState(){
localStorage.setItem("woodfish_count",String(totalCount));
localStorage.setItem("woodfish_today",String(todayCount));
 localStorage.setItem("woodfish_sound",soundOn?"1":"0");
 localStorage.setItem("woodfish_auto",autoOn?"1":"0");
 localStorage.setItem("woodfish_freq",String(autoFreq));
 localStorage.setItem("woodfish_dur",String(autoDur));
}

window.showPage=function(n){
for(var k in pages)pages[k].classList.remove("active");
pages[n].classList.add("active");
if(n===3){
var t=$("wishInput").value.trim()||"诚心叩拜";
var d=$("wishDesc").value.trim();
$("wishTitle").textContent=t;
$("wishDescDisplay").textContent=d;
localStorage.setItem("woodfish_wish",JSON.stringify({title:t,desc:d}));
updateDisplay();
startTimeUpdater();
startIncense();
}
if(n!==3){stopTimeUpdater();stopIncense();}
};

$("templeEnter").addEventListener("click",function(){showPage(2)});
$("startPractice").addEventListener("click",function(){showPage(3)});

function updateDisplay(){
$("totalCount").textContent=totalCount;
$("todayCount").textContent=todayCount;
$("comboCount").textContent=combo;
}

// 木鱼声
var audioCtx=null;
function playSound(){
if(!soundOn)return;
try{
if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
var o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.connect(g);g.connect(audioCtx.destination);
o.frequency.setValueAtTime(180,audioCtx.currentTime);
o.frequency.exponentialRampToValueAtTime(80,audioCtx.currentTime+.15);
g.gain.setValueAtTime(.4,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.15);
o.type="sine";
o.start();o.stop(audioCtx.currentTime+.15);
}catch(e){}
}

function hit(){
totalCount++;todayCount++;combo++;
var now=Date.now();
if(now-lastHit>2000)combo=1;
lastHit=now;
saveState();updateDisplay();

var fc=$("fishClickable");
fc.classList.remove("hit");void fc.offsetWidth;fc.classList.add("hit");

var ft=document.createElement("div");
ft.className="float-text";ft.textContent="+1";
 ft.style.left=(50+Math.random()*80-40)+"%";
 ft.style.top="30%";
 fc.parentNode.appendChild(ft);
setTimeout(function(){ft.remove()},1000);

var q=$("quote");
q.textContent=QUOTES[Math.floor(Math.random()*QUOTES.length)];
q.classList.add("show");
clearTimeout(q._t);
q._t=setTimeout(function(){q.classList.remove("show")},800);

playSound();

if(combo===10)showRays();
if(combo===50)showLotus();
if(combo===100)showBuddhaLight();
}

function showRays(){
var fx=$("fxLayer");
for(var i=0;i<8;i++){
var r=document.createElement("div");
r.style.cssText="position:absolute;top:50%;left:50%;width:3px;height:0;background:linear-gradient(to bottom,transparent,var(--gold2),transparent);transform-origin:center top;opacity:0;animation:rayAnim .8s ease-out forwards";
r.style.transform="translate(-50%,-50%) rotate("+i*45+"deg)";
fx.appendChild(r);setTimeout(function(){r.remove()},900);
}
}
function showLotus(){
var fx=$("fxLayer");
for(var i=0;i<6;i++){
var l=document.createElement("div");
l.textContent="🪷";l.style.cssText="position:absolute;font-size:24px;opacity:0;animation:lotusAnim 2s ease-out forwards";
l.style.left=(10+i*15)+"%";l.style.top="50%";
fx.appendChild(l);setTimeout(function(){l.remove()},2100);
}
}
function showBuddhaLight(){$("buddhaLight").classList.remove("show");void $("buddhaLight").offsetWidth;$("buddhaLight").classList.add("show");setTimeout(function(){$("buddhaLight").classList.remove("show")},2000)}

$("fishClickable").addEventListener("click",hit);
document.addEventListener("keydown",function(e){
if(pages[3].classList.contains("active")&&e.key===" "){e.preventDefault();hit();}
});

// 自动敲击
function startAuto(){
  clearInterval(autoTimer);
  autoTimer=setInterval(hit,autoFreq);
  $("autoPanel").classList.add("show");
  if(autoDur>0){
    autoDurRemain=autoDur;
    updateDurCountdown();
    autoDurTimer=setInterval(function(){
      autoDurRemain--;
      updateDurCountdown();
      if(autoDurRemain<=0)stopAuto();
    },1000);
  }else{$("durCountdown").textContent="";}
}
function stopAuto(){
  clearInterval(autoTimer);autoTimer=null;
  clearInterval(autoDurTimer);autoDurTimer=null;
  autoOn=false;
  $("autoBtn").classList.remove("on");
  $("autoPanel").classList.remove("show");
  $("durCountdown").textContent="";
  saveState();
}
function updateDurCountdown(){
  if(autoDurRemain>0){
    var m=Math.floor(autoDurRemain/60),s=autoDurRemain%60;
    $("durCountdown").textContent="剩余"+(m>0?m+"分"+(s<10?"0":"")+s+"秒":s+"秒");
  }
}
$("autoBtn").addEventListener("click",function(){
  autoOn=!autoOn;
  $("autoBtn").classList.toggle("on",autoOn);
  saveState();
  if(autoOn)startAuto();
  else{clearInterval(autoTimer);autoTimer=null;clearInterval(autoDurTimer);autoDurTimer=null;$("autoPanel").classList.remove("show");}
});
$("freqSlider").addEventListener("input",function(){
  autoFreq=parseInt(this.value);
  $("freqVal").textContent=autoFreq+"ms";
  saveState();
  if(autoOn){clearInterval(autoTimer);autoTimer=setInterval(hit,autoFreq);}
});
$("durSelect").addEventListener("change",function(){
  autoDur=parseInt(this.value);
  saveState();
  if(autoOn){
    clearInterval(autoDurTimer);autoDurTimer=null;
    if(autoDur>0){
      autoDurRemain=autoDur;
      updateDurCountdown();
      autoDurTimer=setInterval(function(){
        autoDurRemain--;
        updateDurCountdown();
        if(autoDurRemain<=0)stopAuto();
      },1000);
    }else{$("durCountdown").textContent="";}
  }
});
$("soundBtn").addEventListener("click",function(){
soundOn=!soundOn;$("soundBtn").classList.toggle("on",soundOn);saveState();
});
$("resetBtn").addEventListener("click",function(){
if(!confirm("确定重置所有功德吗？"))return;
totalCount=0;todayCount=0;combo=0;saveState();updateDisplay();
});

// 香
function startIncense(){
stopIncense();
incenseProgress=[1,1,1];
var sticks=document.querySelectorAll(".incense-stick");
sticks.forEach(function(s){s.classList.remove("burnt");s.classList.add("burning");s.style.height="60px";});
incenseTimer=setInterval(function(){
var allBurnt=true;
for(var i=0;i<3;i++){
if(incenseProgress[i]>0){
incenseProgress[i]-=0.002;
var h=Math.max(15,60*incenseProgress[i]);
var sticks2=document.querySelectorAll(".incense-stick");
sticks2[i].style.height=h+"px";
if(incenseProgress[i]<=0){sticks2[i].classList.remove("burning");sticks2[i].classList.add("burnt");}
else allBurnt=false;
}
}
if(allBurnt)stopIncense();
},100);
}
function stopIncense(){if(incenseTimer){clearInterval(incenseTimer);incenseTimer=null;}}
$("incenseBtn").addEventListener("click",function(){startIncense();});

// 时间
var timeTimer=null;
function startTimeUpdater(){
stopTimeUpdater();
timeTimer=setInterval(function(){
var d=new Date();
$("timeNow").textContent=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
},1000);
var d=new Date();
$("timeNow").textContent=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
}
function stopTimeUpdater(){if(timeTimer){clearInterval(timeTimer);timeTimer=null;}}

// 花瓣
for(var i=0;i<8;i++){
var p=document.createElement("div");
p.className="petal";
p.style.left=Math.random()*100+"%";
p.style.animationDuration=(5+Math.random()*5)+"s";
p.style.animationDelay=Math.random()*5+"s";
p.style.width=(6+Math.random()*6)+"px";
p.style.height=p.style.width;
document.body.appendChild(p);
}

// CSS动画补充
var style=document.createElement("style");
style.textContent="@keyframes rayAnim{0%{opacity:0;height:0}30%{opacity:1;height:200px}100%{opacity:0;height:300px}}@keyframes lotusAnim{0%{opacity:0;transform:translateY(0) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translateY(-100px) scale(1.5)}}";
document.head.appendChild(style);

loadState();
$("soundBtn").classList.toggle("on",soundOn);
$("autoBtn").classList.toggle("on",autoOn);
$("freqSlider").value=autoFreq;
$("freqVal").textContent=autoFreq+"ms";
$("durSelect").value=String(autoDur);
if(autoOn){startAuto();}
})();
</script>
</body>
</html>
